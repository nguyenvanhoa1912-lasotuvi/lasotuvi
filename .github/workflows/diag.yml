name: diag
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tools-diag/**"]
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm i --no-save xlsx@0.18.5 && node tools-diag/cnvn.js
