name: gia-ga-long probe
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node gia-ga-long/scripts/probe.js > /tmp/probe.txt 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan probe-out; git rm -rf -q .; cp /tmp/probe.txt probe.txt
          git add probe.txt; git commit -q -m probe; git push -f origin probe-out
