name: gia-ga-long probe (tạm)
on: workflow_dispatch
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1.47.2 && npx playwright install --with-deps chromium
      - run: node gia-ga-long/scripts/probe-cnvn.js || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/o && cp /tmp/probe.txt /tmp/o/ && cp /tmp/cnvn.png /tmp/o/ 2>/dev/null || true
          git checkout --orphan probe-out2; git rm -rf -q .; cp /tmp/o/* .
          git add -A; git commit -q -m probe; git push -f origin probe-out2
