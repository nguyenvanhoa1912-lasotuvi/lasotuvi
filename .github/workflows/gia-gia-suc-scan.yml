name: Quét giá gia súc
on:
  schedule:
    - cron: "37 23 * * *"   # 06:37 sáng giờ Việt Nam, mỗi ngày
    - cron: "37 10 * * 2,3" # 17:37 thứ Ba, thứ Tư (ngày Tạp chí Chăn nuôi thường đăng bảng giá)
    - cron: "37 14 * * 2"   # 21:37 thứ Ba (file Excel đôi khi đăng muộn)
    - cron: "37 3 * * 3,4"  # 10:37 thứ Tư, thứ Năm (dự phòng khi GitHub bỏ lượt quét sáng)
    - cron: "37 */2 * * 2,3" # mỗi 2 giờ từ sáng thứ Ba đến sáng thứ Năm (giờ VN) – kỳ đăng bảng giá
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["gia-gia-suc/sources.json", "gia-gia-suc/scripts/**", "gia-gia-suc/scanner-core.js"]
permissions:
  contents: write
concurrency:
  group: gia-gia-suc-scan
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cài thư viện đọc Excel
        run: npm i --no-save xlsx@0.18.5
      - name: Quét nguồn
        run: node gia-gia-suc/scripts/scan.js
      - name: Lưu data.json nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gia-gia-suc/data.json
          if git diff --cached --quiet; then echo "Không có thay đổi"; exit 0; fi
          git commit -m "Cập nhật giá gia súc $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
