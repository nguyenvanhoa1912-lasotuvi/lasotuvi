<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi giá gà lông</title>
<meta name="description" content="Giá gà hơi tại trại (gà trắng, gà lông màu) theo 3 miền năm 2026, quét tự động từ Tạp chí Chăn nuôi Việt Nam và GreenFeed, có nguồn dẫn.">
<meta property="og:title" content="Theo dõi giá gà lông">
<meta property="og:description" content="Giá gà hơi tại trại 3 miền, biểu đồ T1–T12/2026, cập nhật tự động, song ngữ VI/EN.">
<meta name="theme-color" content="#070c19">
<style>html,body{margin:0;background:#070c19}html.light,html.light body{background:#eef2f9}#gagl26{border-radius:0;min-height:100vh}</style>
<script>try{if(localStorage.getItem("cgc_theme")==="light")document.documentElement.className="light"}catch(e){}</script>
</head>
<body>
<!-- ===== BẮT ĐẦU: THEO DÕI GIÁ GÀ LÔNG (Blogger embed) ===== -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* Layout: đồng bộ bộ màu trang Cúm gia cầm — banner gradient đỏ, thẻ bo 14px có vạch màu, nền tối mặc định + chế độ sáng; khóa trong #gagl26 */
#gagl26{
  --bg:#070c19;--panel:#0f172b;--panel2:#16213b;--ink:#eaf0ff;--muted:#8d9cbd;--line:#243152;--grid:#1b2643;
  --red:#ff2e4d;--red-bg:rgba(255,46,77,.16);--amber:#ffb020;--amber-bg:rgba(255,176,32,.16);
  --ok:#27d196;--ok-bg:rgba(39,209,150,.14);--accent:#4f8cff;--accent2:#7c4dff;--cyan:#29c5f6;--violet:#a36bff;
  --s-bac:#29c5f6;--s-trung:#ffb020;--s-nam:#a36bff;--future:rgba(36,49,82,.35);
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --f-body:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:ui-monospace,Consolas,"Courier New",monospace;
  color-scheme:dark;background:var(--bg);color:var(--ink);
  font:14px/1.5 var(--f-body);border-radius:14px;max-width:100%;overflow:hidden;text-align:left;
}
#gagl26[data-theme="light"]{
  --bg:#eef2f9;--panel:#ffffff;--panel2:#f4f7fc;--ink:#101a33;--muted:#5a6a8a;--line:#d7deeb;--grid:#e6ebf4;
  --red:#e0193a;--red-bg:#ffe3e8;--amber:#c27a00;--amber-bg:#fff2d6;--ok:#0f9d6b;--ok-bg:#dcf6ec;
  --accent:#2f6fe4;--accent2:#6a3fe0;--cyan:#0b8fc2;--violet:#7a45e0;
  --s-bac:#0b8fc2;--s-trung:#c27a00;--s-nam:#7a45e0;--future:#e8edf6;
  --shadow:0 6px 20px rgba(20,40,80,.12);color-scheme:light;
}
#gagl26 *,#gagl26 *::before,#gagl26 *::after{box-sizing:border-box}
#gagl26 h1,#gagl26 h2,#gagl26 p,#gagl26 ul,#gagl26 table{margin:0}
#gagl26 a{color:var(--accent)}
#gagl26 [hidden]{display:none!important}
#gagl26 .num{font-variant-numeric:tabular-nums}
#gagl26 .muted{color:var(--muted)}
#gagl26 .note{font-size:11.5px;color:var(--muted)}
/* banner */
#gagl26 .hdr{padding:14px 18px;background:linear-gradient(110deg,#1a0b2e 0%,#3a0d2a 35%,#7a0f25 70%,#b3121f 100%);color:#fff;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
#gagl26 .hdr h1{font:800 20px/1.25 var(--f-body);letter-spacing:.5px;margin:0;display:flex;align-items:center;gap:10px;color:#fff;text-transform:uppercase;padding:0;border:0;background:none}
#gagl26 .hdr .dot{width:12px;height:12px;border-radius:50%;background:#ffb020;box-shadow:0 0 0 0 rgba(255,176,32,.8);animation:g26pulse 1.8s infinite;flex:none}
@keyframes g26pulse{0%{box-shadow:0 0 0 0 rgba(255,176,32,.8)}70%{box-shadow:0 0 0 14px rgba(255,176,32,0)}100%{box-shadow:0 0 0 0 rgba(255,176,32,0)}}
@media (prefers-reduced-motion:reduce){#gagl26 .hdr .dot{animation:none}}
#gagl26 .hdr .sub{color:#ffd6dc;font-size:12px;margin-top:2px}
#gagl26 .hdr .row{gap:6px}
#gagl26 a.nav{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.45);border-radius:18px;padding:4px 11px;font-size:12px;font-weight:600;white-space:nowrap}
#gagl26 a.nav.back{background:#fff;color:#8a0f22;font-weight:700;display:none}
#gagl26[data-standalone] a.nav.back{display:inline-block}
#gagl26 .hdr .tbtn{border-color:rgba(255,255,255,.45);color:#fff}
#gagl26 .lang{display:inline-flex;border:1px solid rgba(255,255,255,.45);border-radius:18px;overflow:hidden}
#gagl26 .lang button{background:transparent;color:#fff;border:0;border-radius:0;padding:4px 11px;font:700 12px var(--f-body);cursor:pointer;margin:0;box-shadow:none}
#gagl26 .lang button.on{background:#fff;color:#8a0f22}
/* khung */
#gagl26 .wrap{display:grid;gap:14px;padding:14px 18px 18px}
#gagl26 .intro{display:grid;gap:6px}
#gagl26 .intro p{color:var(--muted);max-width:90ch;font-size:13px}
#gagl26 .facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--muted)}
#gagl26 .facts b{color:var(--ink);font-weight:700}
#gagl26 .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
#gagl26 .card h2{font:700 14px/1.3 var(--f-body);margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel2);color:var(--ink);text-transform:none;letter-spacing:0}
#gagl26 .card h2 .t{display:flex;align-items:center}
#gagl26 .card h2 .t::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--red),var(--accent2));margin-right:8px;flex:none}
#gagl26 .card .body{padding:12px 14px;display:grid;gap:10px}
#gagl26 .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
#gagl26 .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#gagl26 .between{justify-content:space-between}
/* KPI */
#gagl26 .kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
#gagl26 .kpi{border-radius:12px;padding:10px 12px 10px 15px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden;display:grid;gap:2px;min-width:0}
#gagl26 .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
#gagl26 .kpi .lbl{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
#gagl26 .kpi .val{font:800 24px/1.15 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink)}
#gagl26 .kpi .meta{font-size:11.5px;color:var(--muted)}
#gagl26 .kpi.alert{border-color:var(--red);background:var(--red-bg)}
#gagl26 .kpi.flag{border-color:var(--amber)}
#gagl26 .up{color:var(--red)} #gagl26 .down{color:var(--ok)}
#gagl26 .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
#gagl26 .b-red{background:var(--red-bg);color:var(--red)}
#gagl26 .b-amber{background:var(--amber-bg);color:var(--amber)}
#gagl26 .b-ok{background:var(--ok-bg);color:var(--ok)}
#gagl26 .b-grey{border:1px solid var(--line);color:var(--muted)}
#gagl26 .b-blue{background:rgba(79,140,255,.16);color:var(--accent)}
/* nút */
#gagl26 button{font:600 13px var(--f-body);margin:0;box-shadow:none;text-transform:none;line-height:1.4}
#gagl26 .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
#gagl26 .btn:disabled{opacity:.5;cursor:wait}
#gagl26 .tbtn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:4px 11px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
#gagl26 .tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#gagl26 .tbtn input{display:none}
#gagl26 button:focus-visible,#gagl26 a:focus-visible,#gagl26 input:focus-visible,#gagl26 textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#gagl26 input[type=number],#gagl26 input[type=text]{font:13px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:130px;margin:0;box-shadow:none;height:auto}
#gagl26 textarea{width:100%;min-height:76px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px;font:12px/1.45 var(--f-mono);resize:vertical;margin:0}
#gagl26 label{font-size:11.5px;color:var(--muted);display:grid;gap:3px;margin:0}
#gagl26 .thr{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
/* biểu đồ */
#gagl26 .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
#gagl26 .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
#gagl26 .legend i.dash{background:none!important;border-top:2px dashed var(--muted);height:0}
#gagl26 .legend i.ref{width:9px;height:9px;border:2px solid var(--muted);border-radius:0;transform:rotate(45deg);background:transparent;margin-right:8px}
#gagl26 .chart{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}
#gagl26 .chart svg{display:block;min-width:560px;width:100%;height:auto;max-width:none}
#gagl26 svg text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
#gagl26 .readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;font-size:12.5px;min-height:40px;border-top:1px dashed var(--line);padding-top:10px}
#gagl26 .readout b{font-weight:800;color:var(--ink)}
/* bảng */
#gagl26 .tbl{overflow:auto;-webkit-overflow-scrolling:touch}
#gagl26 .tbl.scroll{max-height:420px}
#gagl26 table{border-collapse:collapse;width:100%;font-size:12.5px;background:transparent;border:0}
#gagl26 th{text-align:left;font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;border:0;border-bottom:1px solid var(--line);padding:7px 6px;white-space:nowrap;background:var(--panel);position:sticky;top:0;z-index:1}
#gagl26 td{border:0;border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top;color:var(--ink);background:transparent}
#gagl26 td.r,#gagl26 th.r{text-align:right}
#gagl26 th.grp{text-align:center}
#gagl26 tr.future td{background:var(--future);color:var(--muted)}
#gagl26 tr.ref td{font-style:italic}
#gagl26 td .d{display:block;font-size:11px}
#gagl26 .matrix{min-width:780px}
#gagl26 .ledger{min-width:860px}
#gagl26 td.over{background:var(--red-bg)}
#gagl26 td.flagcell{background:var(--amber-bg)}
#gagl26 ul.clean{padding:0 0 0 18px;display:grid;gap:6px;list-style:disc}
#gagl26 ul.clean li{margin:0;padding:0;background:none;list-style:disc;color:var(--ink)}
#gagl26 ul.clean li::before{content:none}
/* quét & nguồn */
#gagl26 .status{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
#gagl26 .status b{color:var(--ink)}
#gagl26 .sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
#gagl26 .sdot.ok{background:var(--ok)} #gagl26 .sdot.err{background:var(--red)} #gagl26 .sdot.run{background:var(--amber)}
#gagl26 .prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
#gagl26 .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--red));transition:width .3s}
#gagl26 .log{font:12px/1.45 var(--f-mono);color:var(--muted);max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
#gagl26 .srcs{display:grid;gap:6px;font-size:12.5px}
#gagl26 .srcs .s{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#gagl26 .xbtn{border:0;background:transparent;color:var(--red);cursor:pointer;font:700 13px var(--f-body);padding:0 4px}
#gagl26 .news{display:grid;gap:8px;font-size:13px}
#gagl26 .news .it{display:grid;gap:2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
#gagl26 .news .it:last-child{border-bottom:0}
#gagl26 .mention{font-size:12.5px;border-left:3px solid var(--line);padding:2px 0 2px 10px}
#gagl26 details summary{cursor:pointer;font-weight:600;padding:4px 0;color:var(--ink)}
#gagl26 .foot{font-size:11.5px;color:var(--muted);text-align:right;padding:0 18px 14px}
@media(max-width:600px){#gagl26 .wrap{padding:10px;gap:10px}#gagl26 .hdr{padding:10px 12px}#gagl26 .hdr h1{font-size:16px}#gagl26 .kpi .val{font-size:20px}}
</style>
<div id="gagl26" lang="vi" data-theme="dark" data-standalone="1">
<header class="hdr">
  <div>
    <h1><span class="dot" aria-hidden="true"></span><span data-i18n="title"></span></h1>
    <div class="sub" data-i18n="subtitle"></div>
  </div>
  <div class="row">
    <a class="nav back" href="https://avian-influenza-situation.blogspot.com/" target="_top" data-i18n="back"></a>
    <a class="nav" href="https://nguyenvanhoa1912-lasotuvi.github.io/lasotuvi/cum-gia-cam/" target="_top" data-i18n="toFlu"></a>
    <button type="button" class="tbtn" id="g26-theme"></button>
    <div class="lang" role="group" aria-label="Ngôn ngữ / Language" id="g26-lang"><button type="button" data-v="vi">VI</button><button type="button" data-v="en">EN</button></div>
  </div>
</header>

<div class="wrap">
  <div class="intro">
    <p data-i18n="sub"></p>
    <div class="facts">
      <span><span data-i18n="unitL"></span> <b data-i18n="unitV"></b></span>
      <span><span data-i18n="mainL"></span> <b id="g26-fCount">–</b> <span data-i18n="tables"></span> <b id="g26-fRange">–</b></span>
      <span><span data-i18n="gfL"></span> <b id="g26-fGf">–</b></span>
      <span><span data-i18n="updL"></span> <b id="g26-fUpd">–</b></span>
    </div>
  </div>

  <section class="card" aria-labelledby="g26-h-kpi">
    <h2 id="g26-h-kpi"><span class="t" data-i18n="hKpi"></span><span class="note" data-i18n="kpiNote"></span></h2>
    <div class="body"><div class="kgrid" id="g26-kpis"></div></div>
  </section>

  <section class="card" aria-labelledby="g26-h-chart">
    <h2 id="g26-h-chart"><span class="t" data-i18n="hChart"></span>
      <span class="row">
        <span class="row" id="g26-segProd"><button type="button" class="tbtn on" data-v="trang" data-i18n="segTrang"></button><button type="button" class="tbtn" data-v="mau" data-i18n="segMau"></button></span>
        <span class="row" id="g26-segGran"><button type="button" class="tbtn on" data-v="m" data-i18n="byMonth"></button><button type="button" class="tbtn" data-v="w" data-i18n="byWeek"></button></span>
        <label class="tbtn on" id="g26-refLbl"><input type="checkbox" id="g26-showRef" checked><span data-i18n="refPts"></span></label>
      </span>
    </h2>
    <div class="body">
      <div class="legend" id="g26-legend"></div>
      <div class="chart" id="g26-chart"></div>
      <div class="readout" id="g26-readout"></div>
      <p class="note" id="g26-chartNote"></p>
    </div>
  </section>

  <section class="card" aria-labelledby="g26-h-matrix">
    <h2 id="g26-h-matrix"><span class="t" data-i18n="hMatrix"></span><button type="button" class="btn" id="g26-csv" data-i18n="csv"></button></h2>
    <div class="body">
      <div class="tbl"><table class="matrix" id="g26-matrix"></table></div>
      <p class="note" data-i18n="matrixNote"></p>
    </div>
  </section>

  <div class="grid2">
    <section class="card" aria-labelledby="g26-h-scan">
      <h2 id="g26-h-scan"><span class="t" data-i18n="hScan"></span><span id="g26-scanBadge"></span></h2>
      <div class="body">
        <div class="status" id="g26-status"></div>
        <div class="row">
          <button type="button" class="btn" id="g26-scanNow" data-i18n="scanNow"></button>
          <button type="button" class="tbtn" id="g26-reload" data-i18n="reload"></button>
          <a class="tbtn" style="text-decoration:none" href="https://github.com/nguyenvanhoa1912-lasotuvi/lasotuvi/actions/workflows/gia-ga-long-scan.yml" target="_blank" rel="noopener" data-i18n="runGh"></a>
        </div>
        <div class="prog"><i id="g26-prog"></i></div>
        <div class="log" id="g26-log"></div>
        <p class="note" data-i18n="scanNote"></p>
      </div>
    </section>

    <section class="card" aria-labelledby="g26-h-src">
      <h2 id="g26-h-src"><span class="t" data-i18n="hSrc"></span></h2>
      <div class="body">
        <div class="srcs" id="g26-srcs"></div>
        <label for="g26-addSrc"><span data-i18n="addL"></span>
          <textarea id="g26-addSrc" spellcheck="false" placeholder="https://…&#10;Tên nguồn | https://…"></textarea></label>
        <div class="row">
          <button type="button" class="btn" id="g26-addBtn" data-i18n="addBtn"></button>
          <a class="tbtn" style="text-decoration:none" href="https://github.com/nguyenvanhoa1912-lasotuvi/lasotuvi/edit/main/gia-ga-long/sources.json" target="_blank" rel="noopener" data-i18n="saveGh"></a>
          <span class="note" id="g26-addMsg"></span>
        </div>
        <p class="note" data-i18n="addNote"></p>
      </div>
    </section>
  </div>

  <div class="grid2">
    <section class="card" aria-labelledby="g26-h-insight">
      <h2 id="g26-h-insight"><span class="t" data-i18n="hInsight"></span></h2>
      <div class="body"><ul class="clean" id="g26-insights"></ul></div>
    </section>
    <section class="card" aria-labelledby="g26-h-thr">
      <h2 id="g26-h-thr"><span class="t" data-i18n="hThr"></span></h2>
      <div class="body">
        <div class="thr">
          <label for="g26-thr_trang"><span data-i18n="thrTrang"></span><input id="g26-thr_trang" type="number" min="0" step="500" inputmode="numeric" placeholder="32000"></label>
          <label for="g26-thr_mau"><span data-i18n="thrMau"></span><input id="g26-thr_mau" type="number" min="0" step="500" inputmode="numeric" placeholder="50000"></label>
        </div>
        <p class="note" data-i18n="thrNote"></p>
      </div>
    </section>
  </div>

  <section class="card" aria-labelledby="g26-h-ledger">
    <h2 id="g26-h-ledger"><span class="t" data-i18n="hLedger"></span><span class="note" data-i18n="ledgerNote"></span></h2>
    <div class="body">
      <div class="tbl scroll"><table class="ledger" id="g26-ledger"></table></div>
      <details><summary data-i18n="gfTableT"></summary><div class="tbl scroll"><table class="ledger" id="g26-gfTable"></table></div></details>
    </div>
  </section>

  <div class="grid2">
    <section class="card" aria-labelledby="g26-h-news">
      <h2 id="g26-h-news"><span class="t" data-i18n="hNews"></span></h2>
      <div class="body"><div class="news" id="g26-news"></div></div>
    </section>
    <section class="card" aria-labelledby="g26-h-men">
      <h2 id="g26-h-men"><span class="t" data-i18n="hMen"></span></h2>
      <div class="body"><p class="note" data-i18n="menNote"></p><div class="news" id="g26-mentions"></div></div>
    </section>
  </div>

  <div class="grid2">
    <section class="card" aria-labelledby="g26-h-ref">
      <h2 id="g26-h-ref"><span class="t" data-i18n="hRef"></span></h2>
      <div class="body"><div class="tbl"><table id="g26-refTable"></table></div></div>
    </section>
    <section class="card" aria-labelledby="g26-h-ta">
      <h2 id="g26-h-ta"><span class="t" data-i18n="hTa"></span></h2>
      <div class="body"><p class="note" data-i18n="taIntro"></p><ul class="clean" id="g26-taList"></ul></div>

ôi - Tạp chí Chăn nuôi Việt Nam","date":"2026-10-06","mentions":[{"text":"Sau hơn 2 tháng giảm trong tháng 7 và 8-2026, giá gà bắt đầu phục hồi từ đầu tháng 9 và hiện cao hơn khoảng 10 nghìn đồng/kg so với mức thấp nhất.","kind":"khac","region":null},{"text":"Khảo sát thực tế tại các cơ sở chăn nuôi trên địa bàn tỉnh, chúng tôi được biết tại thời điểm giá gà xuống thấp nhất, gà đồi Tân Khánh chỉ còn khoảng 52 nghìn đồng/kg, giảm 20 nghìn đồng/kg; gà màu nuôi chuồng kín khoảng 43 nghìn đồng/kg, giảm 15 nghìn đồng/kg; gà lông trắng khoảng 30 nghìn đồng/kg, giảm hơn 10 nghìn đồng/kg.","kind":"trang","region":null},{"text":"Gia đình bà nuôi gà màu chuồng kín, có thời điểm giá xuống 35 – 36 nghìn đồng/kg rồi tăng lên 45 – 46 nghìn đồng/kg, trong khi theo tính toán của gia đình, giá phải đạt khoảng 50 nghìn đồng/kg mới có công.","kind":"mau","region":null}],"name":"Người Chăn Nuôi – Giá gà bấp bênh (Thái Nguyên)"},{"url":"https://nguoichannuoi.vn/gia-ga-thit-giam-sau-nguoi-chan-nuoi-lo-nang/","title":"Giá gà thịt giảm sâu, người chăn nuôi lỗ nặng - Tin tức Chăn nuôi - Tạp chí Chăn nuôi Việt Nam","date":"2026-09-21","mentions":[{"text":"Tương tự, trang trại nuôi gà thịt của gia đình ông Nguyễn Văn Quyền, xã Hoa Lộc cũng đang phải gánh lỗ khoảng 10 nghìn đồng/kg gà thịt xuất chuồng vì giá “chạm đáy” suốt thời gian qua.","kind":"khac","region":null},{"text":"Theo ông Quyền, trang trại của gia đình ông chủ yếu nuôi gà lai, mấy tháng nay giá bán ra chỉ từ 42 – 48 nghìn đồng/kg, thấp nhất trong các loại gà nên đang bị thua lỗ.","kind":"mau","region":null},{"text":"Hiện nay, giá gà lai xuất chuồng đang ở mức từ 40 – 48 nghìn đồng/kg; gà ri trên 70 nghìn đồng/kg; gà lông trắng chỉ hơn 30 nghìn đồng/kg, đây là mức giá thấp nhất trong những năm gần đây.","kind":"trang","region":null},{"text":"So với cùng kỳ năm ngoái, giá gà thịt giảm từ 8-10 nghìn đồng/kg.","kind":"khac","region":null}],"name":"Người Chăn Nuôi – Giá gà thịt giảm sâu (Thanh Hóa)"}],"log":[{"at":"2026-10-13T13:58:05 function fetchText(url){
  var tries=[url].concat(PROXIES.map(function(p){return p+encodeURIComponent(url)}));
  var i=0;
  function next(){
    if(i>=tries.length)return Promise.reject(new Error("all failed"));
    var u=tries[i++],ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort()},20000);
    return fetch(u,ctl?{signal:ctl.signal}:{}).then(function(r){clearTimeout(tm);if(!r.ok)throw new Error(r.status);return r.text()}).then(function(tx){if(!tx||tx.length<200)throw new Error("empty");return tx}).catch(function(){return next()});
  }
  return next();
}
