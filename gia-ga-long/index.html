/* ===== CẤU HÌNH / CONFIG ===== */
const REG=["Bac","Trung","Nam"], RCSS={Bac:"--s-bac",Trung:"--s-trung",Nam:"--s-nam"};
const IDX={mau:{Bac:1,Trung:2,Nam:3},trang:{Bac:4,Trung:5,Nam:6}};
const MONTHS=Array.from({length:12},(_,i)=>i+1);
const ncnUrl=d=>{const [y,m,dd]=d.split("-");return `https://nguoichannuoi.vn/gia-san-pham-chan-nuoi-gia-tai-trai-ca-nuoc-ngay-${dd}-${m}-${y}/`};
const ROOT=document.getElementById("gagl26");const $=id=>document.getElementById("g26-"+id);
const store={get(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let lang=store.get("gagl26_lang")==="en"?"en":"vi";
const L=()=>I18N[lang];
const fmt=n=>n==null||isNaN(n)?"–":Math.round(n).toLocaleString(L().locale);
const fmtD=d=>{const [y,m,dd]=d.split("-");return `${dd}/${m}`};
const css=v=>getComputedStyle(ROOT).getPropertyValue(v).trim();
const isFlag=(d,p,r)=>FLAGS.some(f=>f[0]===d&&f[1]===p&&f[2]===r);
let thr=store.get("gagl26_thr")||{}; let prod="trang", gran="m";

/* ===== TÍNH TOÁN / CALC ===== */
function weekly(p,r){return NCN.map(row=>({d:row[0],v:row[IDX[p][r]],flag:isFlag(row[0],p,r)}))}
function monthly(p,r){
  return MONTHS.map(m=>{
    const pts=weekly(p,r).filter(x=>+x.d.slice(5,7)===m);
    if(!pts.length)return {m,v:null,n:0,flag:false,min:null,max:null};
    const vs=pts.map(x=>x.v);
    return {m,v:vs.reduce((a,b)=>a+b,0)/vs.length,n:vs.length,flag:pts.some(x=>x.flag),min:Math.min(...vs),max:Math.max(...vs)};
  });
}
const refsFor=(p,r)=>REFS.filter(x=>x.p===p&&x.r===r);
const lastM=()=>+NCN[NCN.length-1][0].slice(5,7);

/* ===== TEXT TĨNH / STATIC TEXT ===== */
function applyStatic(){
  ROOT.setAttribute("lang",lang);
  ROOT.querySelectorAll("[data-i18n]").forEach(el=>{const v=L()[el.dataset.i18n];if(typeof v==="string")el.textContent=v});
  $("method").innerHTML=L().method.map(x=>`<li>${x}</li>`).join("");
  $("readout").innerHTML=`<span class="muted">${L().hover}</span>`;
  [...$("segLang").children].forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===lang));
}

/* ===== KPI ===== */
function drawKpis(){
  const t=L(), last=NCN[NCN.length-1]; const out=[];
  for(const p of ["trang","mau"])for(const r of REG){
    const v=last[IDX[p][r]]; const t1=monthly(p,r)[0].v; const ytd=t1?((v-t1)/t1*100):null;
    const vals=NCN.map(x=>x[IDX[p][r]]); const lo=Math.min(...vals), hi=Math.max(...vals);
    const over=thr[p]&&v>thr[p]; const fl=isFlag(last[0],p,r);
    out.push(`<div class="kpi${over?" alert":""}${fl?" flag":""}">
      <div class="lbl"><span>${t.prod[p]}</span><span class="chip">${t.reg[r]}</span></div>
      <div class="val">${fmt(v)}</div>
      <div class="meta">${t.period} ${fmtD(last[0])} · ${t.vsT1} <span class="${ytd>0?"up":ytd<0?"down":""}">${ytd>0?"▲":ytd<0?"▼":"■"} ${ytd==null?"–":Math.abs(ytd).toFixed(1)+"%"}</span></div>
      <div class="meta">${t.range} ${fmt(lo)}–${fmt(hi)}${fl?` · <span class="chip warn">${t.verify}</span>`:""}${over?` · ${t.over} ${fmt(thr[p])}`:""}</div>
    </div>`);
  }
  $("kpis").innerHTML=out.join("");
  $("fCount").textContent=NCN.length; $("fRange").textContent=`${fmtD(NCN[0][0])} – ${fmtD(NCN[NCN.length-1][0])}/2026`;
}

/* ===== BIỂU ĐỒ / CHART ===== */
function drawChart(){
  const t=L(), showRef=$("showRef").checked;
  const W=760,H=340,Lp=54,R=18,T=18,B=34, plotW=W-Lp-R, plotH=H-T-B;
  const ys=Date.parse("2026-01-01"), ye=Date.parse("2027-01-01");
  const xMonth=m=>Lp+(m-0.5)/12*plotW, xDate=d=>Lp+(Date.parse(d)-ys)/(ye-ys)*plotW;
  const series=REG.map(r=>({r,mo:monthly(prod,r),wk:weekly(prod,r),refs:refsFor(prod,r)}));
  const vals=[]; series.forEach(s=>{(gran==="m"?s.mo.map(x=>x.v):s.wk.map(x=>x.v)).forEach(v=>v!=null&&vals.push(v)); if(showRef)s.refs.forEach(x=>vals.push(x.min,x.max))});
  if(thr[prod])vals.push(thr[prod]);
  const step=5000, v0=Math.floor((Math.min(...vals)-1000)/step)*step, v1=Math.ceil((Math.max(...vals)+1000)/step)*step;
  const y=v=>T+(1-(v-v0)/(v1-v0))*plotH;
  let g="";
  const lastD=NCN[NCN.length-1][0];
  const fx=gran==="m"?Lp+lastM()/12*plotW:xDate(lastD);
  g+=`<rect x="${fx}" y="${T}" width="${W-R-fx}" height="${plotH}" fill="${css("--future")}"/>`;
  g+=`<text x="${(fx+W-R)/2}" y="${T+16}" text-anchor="middle">${t.future}</text>`;
  for(let v=v0;v<=v1;v+=step)g+=`<line x1="${Lp}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="${css("--grid")}" stroke-width="1"/><text x="${Lp-8}" y="${y(v)+4}" text-anchor="end">${v/1000}k</text>`;
  MONTHS.forEach(m=>{g+=`<text x="${xMonth(m)}" y="${H-12}" text-anchor="middle">${t.mon(m)}</text>`;if(m>1)g+=`<line x1="${Lp+(m-1)/12*plotW}" x2="${Lp+(m-1)/12*plotW}" y1="${T}" y2="${T+plotH}" stroke="${css("--grid")}" stroke-width="1"/>`});
  g+=`<line x1="${Lp}" x2="${W-R}" y1="${T+plotH}" y2="${T+plotH}" stroke="${css("--line")}" stroke-width="1"/>`;
  if(thr[prod]){const yy=y(thr[prod]);g+=`<line x1="${Lp}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${css("--up")}" stroke-dasharray="6 4" stroke-width="1.5"/><text x="${Lp+6}" y="${yy-6}" style="fill:${css("--up")}">highline ${fmt(thr[prod])}</text>`}
  const endLabels=[];
  for(const s of series){
    const c=css(RCSS[s.r]);
    const pts=gran==="m"?s.mo.map(x=>x.v==null?null:{x:xMonth(x.m),y:y(x.v),v:x.v,flag:x.flag,lab:t.mon(x.m)}):s.wk.map(x=>({x:xDate(x.d),y:y(x.v),v:x.v,flag:x.flag,lab:fmtD(x.d)}));
    let seg=[],segs=[]; pts.forEach(p=>{if(p)seg.push(p);else{if(seg.length)segs.push(seg);seg=[]}}); if(seg.length)segs.push(seg);
    segs.forEach(sg=>{g+=`<polyline fill="none" stroke="${c}" stroke-width="${gran==="m"?2.4:1.8}" stroke-linejoin="round" stroke-linecap="round" points="${sg.map(p=>`${p.x},${p.y}`).join(" ")}"/>`});
    const valid=pts.filter(Boolean);
    valid.forEach((p,i)=>{const last=i===valid.length-1;
      g+=`<circle cx="${p.x}" cy="${p.y}" r="${last?4.5:(gran==="m"?3.2:2.4)}" fill="${last?c:css("--surface")}" stroke="${p.flag?css("--warn"):c}" stroke-width="${p.flag?2.5:2}"><title>${t.regLong(s.r)} · ${p.lab}: ${fmt(p.v)}${p.flag?" ("+t.verify+")":""}</title></circle>`});
    if(gran==="m"&&valid.length){const lp=valid[valid.length-1];endLabels.push({x:lp.x+8,y:lp.y+4,c,t:fmt(lp.v)})}
    if(showRef)s.refs.forEach(rf=>{const xx=gran==="m"?xMonth(+rf.date.slice(5,7)):xDate(rf.date);const yy=y((rf.min+rf.max)/2);
      if(rf.min!==rf.max)g+=`<line x1="${xx}" x2="${xx}" y1="${y(rf.min)}" y2="${y(rf.max)}" stroke="${c}" stroke-width="1.5" opacity=".7"/>`;
      g+=`<rect x="${xx-4.5}" y="${yy-4.5}" width="9" height="9" transform="rotate(45 ${xx} ${yy})" fill="${css("--surface")}" stroke="${c}" stroke-width="1.8"><title>${rf.src[lang]} · ${fmtD(rf.date)} · ${t.reg[s.r]}: ${rf.min===rf.max?fmt(rf.min):fmt(rf.min)+"–"+fmt(rf.max)} (${rf.note[lang]})</title></rect>`});
  }
  endLabels.sort((a,b)=>a.y-b.y);
  for(let i=1;i<endLabels.length;i++)if(endLabels[i].y-endLabels[i-1].y<14)endLabels[i].y=endLabels[i-1].y+14;
  endLabels.forEach(l=>{g+=`<text x="${l.x}" y="${l.y}" style="fill:${l.c};font-weight:600">${l.t}</text>`});
  MONTHS.forEach(m=>{g+=`<rect class="hit" data-m="${m}" x="${Lp+(m-1)/12*plotW}" y="${T}" width="${plotW/12}" height="${plotH}" fill="transparent"/>`});
  $("chart").innerHTML=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t.chartAria(t.prod[prod],gran)}">${g}</svg>`;
  $("legend").innerHTML=REG.map(r=>`<span><i style="background:var(${RCSS[r]})"></i>${t.regLong(r)}</span>`).join("")+(showRef?`<span><i class="ref"></i>${t.refLegend}</span>`:"")+(thr[prod]?`<span><i style="background:var(--up)"></i>${t.highline}</span>`:"");
  $("chart").querySelectorAll(".hit").forEach(h=>{const f=()=>readout(+h.dataset.m);h.addEventListener("mouseenter",f);h.addEventListener("click",f)});
  $("chartNote").textContent=gran==="m"?t.noteM:t.noteW;
}
function readout(m){
  const t=L();
  const rows=REG.map(r=>{const x=monthly(prod,r)[m-1];const refs=refsFor(prod,r).filter(f=>+f.date.slice(5,7)===m);
    return `<div><span class="chip">${t.reg[r]}</span> ${x.v==null?`<span class="muted">${t.noMain}</span>`:`<b>${fmt(x.v)}</b> <span class="muted">(n=${x.n}, ${fmt(x.min)}–${fmt(x.max)})</span>`}${x.flag?` <span class="chip warn">${t.verifyShort}</span>`:""}${refs.map(f=>`<div class="muted" style="font-size:12px">◇ ${f.src[lang]}: ${f.min===f.max?fmt(f.min):fmt(f.min)+"–"+fmt(f.max)}</div>`).join("")}</div>`});
  $("readout").innerHTML=`<div><b>${t.monLong(m)}</b><div class="muted" style="font-size:12px">${t.prod[prod]}</div></div>`+rows.join("");
}

/* ===== MA TRẬN THÁNG / MONTHLY MATRIX ===== */
function drawMatrix(){
  const t=L(), cols=[]; for(const p of ["trang","mau"])for(const r of REG)cols.push({p,r,mo:monthly(p,r)});
  let h=`<thead><tr><th rowspan="2">${t.thMonth}</th><th class="grp" colspan="3">${t.prodLong.trang}</th><th class="grp" colspan="3">${t.prodLong.mau}</th><th rowspan="2" class="r">${t.nPeriods}</th></tr><tr>${cols.map(c=>`<th class="r">${t.reg[c.r]}</th>`).join("")}</tr></thead><tbody>`;
  MONTHS.forEach(m=>{
    const n=cols[0].mo[m-1].n;
    if(n){
      h+=`<tr><td class="num">${t.mon(m)}</td>`+cols.map(c=>{const x=c.mo[m-1];
        let prev=null; for(let k=m-2;k>=0;k--)if(c.mo[k].v!=null){prev=c.mo[k].v;break}
        const d=prev!=null?x.v-prev:null; const over=thr[c.p]&&x.v>thr[c.p];
        return `<td class="r num${over?" over":""}${x.flag?" flagcell":""}">${fmt(x.v)}${d!=null?`<span class="d ${d>0?"up":d<0?"down":"muted"}">${d>0?"▲":d<0?"▼":"■"} ${fmt(Math.abs(d))}</span>`:`<span class="d muted">${t.first}</span>`}</td>`}).join("")+`<td class="r num">${n}</td></tr>`;
    }else if(m===10){
      h+=`<tr class="future ref"><td class="num">${t.mon(10)}</td>`+cols.map(c=>{const f=REFS.find(x=>x.date==="2026-10-01"&&x.p===c.p&&x.r===c.r);return `<td class="r num">${f?fmt(f.min):"–"}<span class="d">GreenFeed 01/10</span></td>`}).join("")+`<td class="r num">0</td></tr>`;
    }else{
      h+=`<tr class="future"><td class="num">${t.mon(m)}</td><td colspan="6" class="muted">${t.noData}</td><td class="r num">0</td></tr>`;
    }
  });
  h+=`<tr><td><b>${t.avg(lastM())}</b></td>`+cols.map(c=>{const vs=c.mo.filter(x=>x.v!=null).map(x=>x.v);return `<td class="r num"><b>${fmt(vs.reduce((a,b)=>a+b,0)/vs.length)}</b></td>`}).join("")+`<td class="r num">${NCN.length}</td></tr>`;
  $("matrix").innerHTML=h+"</tbody>";
}

/* ===== SỔ TUẦN / LEDGER ===== */
function drawLedger(){
  const t=L();
  let h=`<thead><tr><th>${t.thPeriod}</th><th class="grp" colspan="3">${t.prodLong.trang}</th><th class="grp" colspan="3">${t.prodLong.mau}</th><th>${t.thSource}</th></tr><tr><th></th>${REG.map(r=>`<th class="r">${t.reg[r]}</th>`).join("")}${REG.map(r=>`<th class="r">${t.reg[r]}</th>`).join("")}<th></th></tr></thead><tbody>`;
  [...NCN].reverse().forEach(row=>{
    const cell=(p,r)=>{const v=row[IDX[p][r]];const fl=isFlag(row[0],p,r);const over=thr[p]&&v>thr[p];return `<td class="r num${fl?" flagcell":""}${over?" over":""}">${fmt(v)}${fl?` <span title="${t.verify}">⚠</span>`:""}</td>`};
    h+=`<tr><td class="num">${fmtD(row[0])}/2026</td>${REG.map(r=>cell("trang",r)).join("")}${REG.map(r=>cell("mau",r)).join("")}<td><a href="${ncnUrl(row[0])}" target="_blank" rel="noopener">${t.srcNcn}</a></td></tr>`;
  });
  $("ledger").innerHTML=h+"</tbody>";
}
function drawRefs(){
  const t=L();
  $("refTable").innerHTML=`<thead><tr><th>${t.thDate}</th><th>${t.thType}</th><th>${t.thRegion}</th><th class="r">${t.thPrice}</th><th>${t.thSource}</th></tr></thead><tbody>`+
    [...REFS].sort((a,b)=>a.date<b.date?1:-1).map(f=>`<tr><td class="num">${fmtD(f.date)}</td><td>${t.prod[f.p]}</td><td>${t.reg[f.r]}</td><td class="r num">${f.min===f.max?fmt(f.min):fmt(f.min)+"–"+fmt(f.max)}</td><td><a href="${f.url}" target="_blank" rel="noopener">${f.src[lang]}</a><span class="d muted">${f.note[lang]}</span></td></tr>`).join("")+"</tbody>";
  $("taList").innerHTML=TA.map(x=>`<li>${x[lang]} <a href="${x.url}" target="_blank" rel="noopener">${x.src[lang]}</a></li>`).join("");
}

/* ===== NHẬN ĐỊNH / INSIGHTS ===== */
function drawInsights(){
  const t=L(), li=[], lm=lastM();
  for(const p of ["trang","mau"]){
    const parts=REG.map(r=>{const m=monthly(p,r);const a=m[0].v,b=m[lm-1].v;return `${t.reg[r]} ${b>a?"+":""}${fmt(b-a)}`}).join(" · ");
    li.push(t.ins1(t.prod[p],parts,lm));
  }
  for(const r of REG){const m=monthly("trang",r).filter(x=>x.v!=null);const lo=m.reduce((a,b)=>b.v<a.v?b:a),hi=m.reduce((a,b)=>b.v>a.v?b:a);
    li.push(t.ins2(t.reg[r],lo.m,fmt(lo.v),hi.m,fmt(hi.v)))}
  li.push(t.ins3);
  li.push(`<span class="chip warn">${t.verifyShort}</span> ${t.ins4}`);
  $("insights").innerHTML=li.map(x=>`<li>${x}</li>`).join("");
}

/* ===== CSV ===== */
$("csvBtn").addEventListener("click",()=>{
  const t=L(), lines=[t.csvHead];
  for(const p of ["trang","mau"])for(const r of REG)monthly(p,r).forEach(x=>{if(x.v!=null)lines.push([`${x.m}/2026`,t.prod[p],t.reg[r],Math.round(x.v),x.n,x.min,x.max,x.flag?t.csvYes:""].join(","))});
  lines.push("",t.csvHead2);
  NCN.forEach(r=>lines.push([r[0],r[4],r[5],r[6],r[1],r[2],r[3],ncnUrl(r[0])].join(",")));
  const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv;charset=utf-8"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=t.csvFile;a.style.display="none";ROOT.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},500);
});

/* ===== ĐIỀU KHIỂN / CONTROLS ===== */
function bindSeg(id,cb){$(id).addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;[...$(id).children].forEach(x=>x.setAttribute("aria-pressed",x===b));cb(b.dataset.v)})}
bindSeg("segProd",v=>{prod=v;drawChart();$("readout").innerHTML=`<span class="muted">${L().hover}</span>`});
bindSeg("segGran",v=>{gran=v;drawChart()});
bindSeg("segLang",v=>{lang=v;store.set("gagl26_lang",v);applyStatic();drawAll()});
$("showRef").addEventListener("change",drawChart);
["trang","mau"].forEach(p=>{const el=$("thr_"+p);if(thr[p])el.value=thr[p];el.addEventListener("change",()=>{const v=Number(el.value);if(v>0)thr[p]=v;else delete thr[p];store.set("gagl26_thr",thr);drawAll()})});
function drawAll(){drawKpis();drawChart();drawMatrix();drawLedger();drawRefs();drawInsights()}
applyStatic(); drawAll();
})();
//]]>
</script>
