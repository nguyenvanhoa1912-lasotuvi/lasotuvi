<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theo dõi giá gia súc</title>

<meta property="og:title" content="Theo dõi giá gia súc Việt Nam">
<meta property="og:description" content="Giá heo hơi tại trại 3 miền, biểu đồ T1–T12/2026, cập nhật tự động, song ngữ VI/EN.">

<script>try{if(localStorage.getItem("cgc_theme")==="light")document.documentElement.className="light"}catch(e){}</script>
</head>
<body>
<!-- ===== BẮT ĐẦU: THEO DÕI GIÁ GIA SÚC (Blogger embed) ===== -->
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet">
<style>
/* Layout: đồng bộ bộ màu trang Cúm gia cầm — banner gradient đỏ, thẻ bo 14px có vạch màu, nền tối mặc định + chế độ sáng; khóa trong #gsgs26 */
#gsgs26{
  --bg:#070c19;--panel:#0f172b;--panel2:#16213b;--ink:#eaf0ff;--muted:#8d9cbd;--line:#243152;--grid:#1b2643;
  --red:#ff2e4d;--red-bg:rgba(255,46,77,.16);--amber:#ffb020;--amber-bg:rgba(255,176,32,.16);
  --ok:#27d196;--ok-bg:rgba(39,209,150,.14);--accent:#4f8cff;--accent2:#7c4dff;--cyan:#29c5f6;--violet:#a36bff;
  --s-bac:#29c5f6;--s-trung:#ffb020;--s-nam:#a36bff;--future:rgba(36,49,82,.35);
  --shadow:0 8px 28px rgba(0,0,0,.45);
  --f-body:"Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:ui-monospace,Consolas,"Courier New",monospace;
  color-scheme:dark;background:var(--bg);color:var(--ink);
  font:14px/1.5 var(--f-body);border-radius:14px;max-width:100%;overflow:hidden;text-align:left;
}
#gsgs26[data-theme="light"]{
  --bg:#eef2f9;--panel:#ffffff;--panel2:#f4f7fc;--ink:#101a33;--muted:#5a6a8a;--line:#d7deeb;--grid:#e6ebf4;
  --red:#e0193a;--red-bg:#ffe3e8;--amber:#c27a00;--amber-bg:#fff2d6;--ok:#0f9d6b;--ok-bg:#dcf6ec;
  --accent:#2f6fe4;--accent2:#6a3fe0;--cyan:#0b8fc2;--violet:#7a45e0;
  --s-bac:#0b8fc2;--s-trung:#c27a00;--s-nam:#7a45e0;--future:#e8edf6;
  --shadow:0 6px 20px rgba(20,40,80,.12);color-scheme:light;
}
#gsgs26 *,#gsgs26 *::before,#gsgs26 *::after{box-sizing:border-box}
#gsgs26 h1,#gsgs26 h2,#gsgs26 p,#gsgs26 ul,#gsgs26 table{margin:0}
#gsgs26 a{color:var(--accent)}
#gsgs26 [hidden]{display:none!important}
#gsgs26 .num{font-variant-numeric:tabular-nums}
#gsgs26 .muted{color:var(--muted)}
#gsgs26 .note{font-size:11.5px;color:var(--muted)}
/* banner */
#gsgs26 .hdr{padding:14px 18px;background:linear-gradient(110deg,#03201a 0%,#0b3d2e 35%,#6b3d0a 72%,#b3121f 100%);color:#fff;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
#gsgs26 .hdr h1{font:800 20px/1.25 var(--f-body);letter-spacing:.5px;margin:0;display:flex;align-items:center;gap:10px;color:#fff;text-transform:uppercase;padding:0;border:0;background:none}
#gsgs26 .hdr .dot{width:12px;height:12px;border-radius:50%;background:#ffb020;box-shadow:0 0 0 0 rgba(255,176,32,.8);animation:g26pulse 1.8s infinite;flex:none}
@keyframes g26pulse{0%{box-shadow:0 0 0 0 rgba(255,176,32,.8)}70%{box-shadow:0 0 0 14px rgba(255,176,32,0)}100%{box-shadow:0 0 0 0 rgba(255,176,32,0)}}
@media (prefers-reduced-motion:reduce){#gsgs26 .hdr .dot{animation:none}}
#gsgs26 .hdr .sub{color:#d8f3e6;font-size:12px;margin-top:2px}
#gsgs26 .hdr .row{gap:6px}
#gsgs26 a.nav{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.45);border-radius:18px;padding:4px 11px;font-size:12px;font-weight:600;white-space:nowrap}
#gsgs26 a.nav.back{background:#fff;color:#8a0f22;font-weight:700;display:none}
#gsgs26[data-standalone] a.nav.back{display:inline-block}
#gsgs26 .hdr .tbtn{border-color:rgba(255,255,255,.45);color:#fff}
#gsgs26 .lang{display:inline-flex;border:1px solid rgba(255,255,255,.45);border-radius:18px;overflow:hidden}
#gsgs26 .lang button{background:transparent;color:#fff;border:0;border-radius:0;padding:4px 11px;font:700 12px var(--f-body);cursor:pointer;margin:0;box-shadow:none}
#gsgs26 .lang button.on{background:#fff;color:#8a0f22}
/* khung */
#gsgs26 .wrap{display:grid;gap:14px;padding:14px 18px 18px}
#gsgs26 .intro{display:grid;gap:6px}
#gsgs26 .intro p{color:var(--muted);max-width:90ch;font-size:13px}
#gsgs26 .facts{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:12.5px;color:var(--muted)}
#gsgs26 .facts b{color:var(--ink);font-weight:700}
#gsgs26 .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);min-width:0}
#gsgs26 .card h2{font:700 14px/1.3 var(--f-body);margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;background:var(--panel2);color:var(--ink);text-transform:none;letter-spacing:0}
#gsgs26 .card h2 .t{display:flex;align-items:center}
#gsgs26 .card h2 .t::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--red),var(--accent2));margin-right:8px;flex:none}
#gsgs26 .card .body{padding:12px 14px;display:grid;gap:10px}
#gsgs26 .grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
#gsgs26 .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
#gsgs26 .between{justify-content:space-between}
/* KPI */
#gsgs26 .kgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:10px}
#gsgs26 .kpi{border-radius:12px;padding:10px 12px 10px 15px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden;display:grid;gap:2px;min-width:0}
#gsgs26 .kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
#gsgs26 .kpi .lbl{display:flex;justify-content:space-between;gap:6px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
#gsgs26 .kpi .val{font:800 24px/1.15 var(--f-body);font-variant-numeric:tabular-nums;color:var(--ink)}
#gsgs26 .kpi .meta{font-size:11.5px;color:var(--muted)}
#gsgs26 .kpi.alert{border-color:var(--red);background:var(--red-bg)}
#gsgs26 .kpi.flag{border-color:var(--amber)}
#gsgs26 .up{color:var(--red)} #gsgs26 .down{color:var(--ok)}
#gsgs26 .badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
#gsgs26 .b-red{background:var(--red-bg);color:var(--red)}
#gsgs26 .b-amber{background:var(--amber-bg);color:var(--amber)}
#gsgs26 .b-ok{background:var(--ok-bg);color:var(--ok)}
#gsgs26 .b-grey{border:1px solid var(--line);color:var(--muted)}
#gsgs26 .b-blue{background:rgba(79,140,255,.16);color:var(--accent)}
/* nút */
#gsgs26 button{font:600 13px var(--f-body);margin:0;box-shadow:none;text-transform:none;line-height:1.4}
#gsgs26 .btn{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer}
#gsgs26 .btn:disabled{opacity:.5;cursor:wait}
#gsgs26 .tbtn{background:transparent;color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:4px 11px;font-size:12px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
#gsgs26 .tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
#gsgs26 .tbtn input{display:none}
#gsgs26 button:focus-visible,#gsgs26 a:focus-visible,#gsgs26 input:focus-visible,#gsgs26 textarea:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
#gsgs26 input[type=number],#gsgs26 input[type=text]{font:13px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:130px;margin:0;box-shadow:none;height:auto}
#gsgs26 textarea{width:100%;min-height:76px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:7px;font:12px/1.45 var(--f-mono);resize:vertical;margin:0}
#gsgs26 label{font-size:11.5px;color:var(--muted);display:grid;gap:3px;margin:0}
#gsgs26 .thr{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-start}
/* biểu đồ */
#gsgs26 .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted)}
#gsgs26 .legend i{display:inline-block;width:16px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle}
#gsgs26 .legend i.dash{background:none!important;border-top:2px dashed var(--muted);height:0}
#gsgs26 .legend i.ref{width:9px;height:9px;border:2px solid var(--muted);border-radius:0;transform:rotate(45deg);background:transparent;margin-right:8px}
#gsgs26 .chart{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative}
#gsgs26 .chart svg{display:block;min-width:560px;width:100%;height:auto;max-width:none}
#gsgs26 svg text{font-family:var(--f-body);font-size:11px;fill:var(--muted)}
#gsgs26 .readout{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 16px;font-size:12.5px;min-height:40px;border-top:1px dashed var(--line);padding-top:10px}
#gsgs26 .readout b{font-weight:800;color:var(--ink)}
/* bảng */
#gsgs26 .tbl{overflow:auto;-webkit-overflow-scrolling:touch}
#gsgs26 .tbl.scroll{max-height:420px}
#gsgs26 table{border-collapse:collapse;width:100%;font-size:12.5px;background:transparent;border:0}
#gsgs26 th{text-align:left;font-weight:600;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;border:0;border-bottom:1px solid var(--line);padding:7px 6px;white-space:nowrap;background:var(--panel);position:sticky;top:0;z-index:1}
#gsgs26 td{border:0;border-bottom:1px solid var(--line);padding:7px 6px;vertical-align:top;color:var(--ink);background:transparent}
#gsgs26 td.r,#gsgs26 th.r{text-align:right}
#gsgs26 th.grp{text-align:center}
#gsgs26 tr.future td{background:var(--future);color:var(--muted)}
#gsgs26 tr.ref td{font-style:italic}
#gsgs26 td .d{display:block;font-size:11px}
#gsgs26 .matrix{min-width:420px}
#gsgs26 .ledger{min-width:520px}
#gsgs26 .prov{min-width:520px}
#gsgs26 td.over{background:var(--red-bg)}
#gsgs26 td.flagcell{background:var(--amber-bg)}
#gsgs26 ul.clean{padding:0 0 0 18px;display:grid;gap:6px;list-style:disc}
#gsgs26 ul.clean li{margin:0;padding:0;background:none;list-style:disc;color:var(--ink)}
#gsgs26 ul.clean li::before{content:none}
/* quét & nguồn */
#gsgs26 .status{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
#gsgs26 .status b{color:var(--ink)}
#gsgs26 .sdot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:6px;vertical-align:middle}
#gsgs26 .sdot.ok{background:var(--ok)} #gsgs26 .sdot.err{background:var(--red)} #gsgs26 .sdot.run{background:var(--amber)}
#gsgs26 .prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
#gsgs26 .prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--red));transition:width .3s}
#gsgs26 .log{font:12px/1.45 var(--f-mono);color:var(--muted);max-height:180px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px}
#gsgs26 .srcs{display:grid;gap:6px;font-size:12.5px}
#gsgs26 .srcs .s{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
#gsgs26 .xbtn{border:0;background:transparent;color:var(--red);cursor:pointer;font:700 13px var(--f-body);padding:0 4px}
#gsgs26 .news{display:grid;gap:8px;font-size:13px}
#gsgs26 .news .it{display:grid;gap:2px;padding-bottom:8px;border-bottom:1px solid var(--line)}
#gsgs26 .news .it:last-child{border-bottom:0}
#gsgs26 .mention{font-size:12.5px;border-left:3px solid var(--line);padding:2px 0 2px 10px}
#gsgs26 details summary{cursor:pointer;font-weight:600;padding:4px 0;color:var(--ink)}
#gsgs26 .foot{font-size:11.5px;color:var(--muted);text-align:right;padding:0 18px 14px}
@media(max-width:600px){#gsgs26 .wrap{padding:10px;gap:10px}#gsgs26 .hdr{padding:10px 12px}#gsgs26 .hdr h1{font-size:16px}#gsgs26 .kpi .val{font-size:20px}}
#gsgs26 .tip{position:absolute;z-index:5;min-width:190px;max-width:260px;pointer-events:none;background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:12px;line-height:1.45;box-shadow:var(--shadow)}
#gsgs26 .tip .th{font-weight:800;font-size:12.5px;margin-bottom:4px;white-space:nowrap}
#gsgs26 .tip .tr,#gsgs26 .readout .tr{display:flex;align-items:center;gap:6px;white-space:nowrap}
#gsgs26 .tip .tr i,#gsgs26 .readout .tr i{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
#gsgs26 .tip .tr span:first-of-type{min-width:42px;color:var(--muted)}
#gsgs26 .tip .tr b{font-weight:800;font-variant-numeric:tabular-nums}
#gsgs26 .tip .ts,#gsgs26 .readout .ts{font-size:11px;color:var(--muted);margin:0 0 3px 15px}
</style>
<div id="gsgs26" lang="vi" data-theme="dark" data-standalone="1">
<header class="hdr">
  <div>
    <h1><span class="dot" aria-hidden="true"></span><span data-i18n="title"></span></h1>
    <div class="sub" data-i18n="subtitle"></div>
  </div>
  <div class="row">
    <a class="nav back" href="https://avian-influenza-situation.blogspot.com/" target="_top" data-i18n="back"></a>
    <a class="nav" href="https://nguyenvanhoa1912-lasotuvi.github.io/lasotuvi/gia-suc/" target="_top" data-i18n="toFlu"></a>
    <a class="nav" href="https://nguyenvanhoa1912-lasotuvi.github.io/lasotuvi/gia-ga-long/" target="_top" data-i18n="toChicken"></a>
    <button type="button" class="tbtn" id="gs6-theme"></button>
    <div class="lang" role="group" aria-label="Ngôn ngữ / Language" id="gs6-lang"><button type="button" data-v="vi">VI</button><button type="button" data-v="en">EN</button></div>
  </div>
</header>

<div class="wrap">
  <div class="intro">
    <p data-i18n="sub"></p>
    <div class="facts">
      <span><span data-i18n="unitL"></span> <b data-i18n="unitV"></b></span>
      <span><span data-i18n="mainL"></span> <b id="gs6-fCount">–</b> <span data-i18n="tables"></span> <b id="gs6-fRange">–</b></span>
      <span><span data-i18n="gfL"></span> <b id="gs6-fGf">–</b></span>
      <span><span data-i18n="updL"></span> <b id="gs6-fUpd">–</b></span>
    </div>
  </div>

  <section class="card" aria-labelledby="gs6-h-kpi">
    <h2 id="gs6-h-kpi"><span class="t" data-i18n="hKpi"></span><span class="note" data-i18n="kpiNote"></span></h2>
    <div class="body"><div class="kgrid" id="gs6-kpis"></div></div>
  </section>

  <section class="card" aria-labelledby="gs6-h-chart">
    <h2 id="gs6-h-chart"><span class="t" data-i18n="hChart"></span>
      <span class="row">
        <span class="row" id="gs6-segProd" hidden><button type="button" class="tbtn on" data-v="heo" data-i18n="segHeo"></button></span>
        <span class="row" id="gs6-segGran"><button type="button" class="tbtn on" data-v="m" data-i18n="byMonth"></button><button type="button" class="tbtn" data-v="w" data-i18n="byWeek"></button></span>
        <label class="tbtn on" id="gs6-refLbl"><input type="checkbox" id="gs6-showRef" checked><span data-i18n="refPts"></span></label>
      </span>
    </h2>
    <div class="body">
      <div class="legend" id="gs6-legend"></div>
      <div class="chart" id="gs6-chart"></div>
      <div class="readout" id="gs6-readout"></div>
      <p class="note" id="gs6-chartNote"></p>
    </div>
  </section>

  <section class="card" aria-labelledby="gs6-h-matrix">
    <h2 id="gs6-h-matrix"><span class="t" data-i18n="hMatrix"></span><button type="button" class="btn" id="gs6-csv" data-i18n="csv"></button></h2>
    <div class="body">
      <div class="tbl"><table class="matrix" id="gs6-matrix"></table></div>
      <p class="note" data-i18n="matrixNote"></p>
    </div>
  </section>

  <div class="grid2">
    <section class="card" aria-labelledby="gs6-h-scan">
      <h2 id="gs6-h-scan"><span class="t" data-i18n="hScan"></span><span id="gs6-scanBadge"></span></h2>
      <div class="body">
        <div class="status" id="gs6-status"></div>
        <div class="row">
          <button type="button" class="btn" id="gs6-scanNow" data-i18n="scanNow"></button>
          <button type="button" class="tbtn" id="gs6-reload" data-i18n="reload"></button>
          <a class="tbtn" style="text-decoration:none" href="https://github.com/nguyenvanhoa1912-lasotuvi/lasotuvi/actions/workflows/gia-gia-suc-scan.yml" target="_blank" rel="noopener" data-i18n="runGh"></a>
        </div>
        <div class="prog"><i id="gs6-prog"></i></div>
        <div class="log" id="gs6-log"></div>
        <p class="note" data-i18n="scanNote"></p>
      </div>
    </section>

    <section class="card" aria-labelledby="gs6-h-src">
      <h2 id="gs6-h-src"><span class="t" data-i18n="hSrc"></span></h2>
      <div class="body">
        <div class="srcs" id="gs6-srcs"></div>
        <label for="gs6-addSrc"><span data-i18n="addL"></span>
          <textarea id="gs6-addSrc" spellcheck="false" placeholder="https://…&#10;Tên nguồn | https://…"></textarea></label>
        <div class="row">
          <button type="button" class="btn" id="gs6-addBtn" data-i18n="addBtn"></button>
          <a class="tbtn" style="text-decoration:none" href="https://github.com/nguyenvanhoa1912-lasotuvi/lasotuvi/edit/main/gia-gia-suc/sources.json" target="_blank" rel="noopener" data-i18n="saveGh"></a>
          <span class="note" id="gs6-addMsg"></span>
        </div>
        <p class="note" data-i18n="addNote"></p>
      </div>
    </section>
  </div>

  <div class="grid2">
    <section class="card" aria-labelledby="gs6-h-insight">
      <h2 id="gs6-h-insight"><span class="t" data-i18n="hInsight"></span></h2>
      <div class="body"><ul class="clean" id="gs6-insights"></ul></div>
    </section>
    <section class="card" aria-labelledby="gs6-h-thr">
      <h2 id="gs6-h-thr"><span class="t" data-i18n="hThr"></span></h2>
      <div class="body">
        <div class="thr">
          <label for="gs6-thr_heo"><span data-i18n="thrHeo"></span><input id="gs6-thr_heo" type="number" min="0" step="500" inputmode="numeric" placeholder="55000"></label>
        </div>
        <p class="note" data-i18n="thrNote"></p>
      </div>
    </section>
  </div>

  <section class="card" aria-labelledby="gs6-h-ledger">
    <h2 id="gs6-h-ledger"><span class="t" data-i18n="hLedger"></span><span class="note" data-i18n="ledgerNote"></span></h2>
    <div class="body">
      <div class="tbl scroll"><table class="ledger" id="gs6-ledger"></table></div>
      <details><summary data-i18n="gfTableT"></summary><div class="tbl scroll"><table class="ledger" id="gs6-gfTable"></table></div></details>
    </div>
  </section>

  <section class="card" aria-labelledby="gs6-h-prov">
    <h2 id="gs6-h-prov"><span class="t" data-i18n="hProv"></span><span class="note" id="gs6-provDate"></span></h2>
    <div class="body">
      <div class="tbl scroll"><table class="prov" id="gs6-prov"></table></div>
      <p class="note" data-i18n="provNote"></p>
    </div>
  </section>

  <div class="grid2">

var fmt=function(n){return n==null||isNaN(n)?"–":Math.round(n).toLocaleString(L().locale)};
var fmtD=function(d){var p=d.split("-");return p[2]+"/"+p[1]};
var fmtDT=function(s){if(!s)return L().never;var d=new Date(s);if(isNaN(d))return s;return d.toLocaleString(L().locale,{day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"})};
var css=function(v){return getComputedStyle(ROOT).getPropertyValue(v).trim()};
var esc=function(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
var ncnUrl=function(d){var p=d.split("-");return "https://nguoichannuoi.vn/gia-san-pham-chan-nuoi-gia-tai-trai-ca-nuoc-ngay-"+p[2]+"-"+p[1]+"-"+p[0]+"/"};
var dayDiff=function(a,b){return Math.abs(Date.parse(a)-Date.parse(b))/864e5};

function weeklyAll(){
  var w=D.weekly.map(function(r){return {r:r,o:(D.meta.origin||{})[r[0]]||"seed"}});
  (LOCAL.weekly||[]).forEach(function(r){if(!w.some(function(x){return x.r[0]===r[0]}))w.push({r:r,o:"local"})});
  return w.sort(function(a,b){return a.r[0]<b.r[0]?-1:1});
}
function gfAll(){
  var g=(D.gf||[]).slice();
  (LOCAL.gf||[]).forEach(function(r){if(!g.some(function(x){return x[0]===r[0]}))g.push(r)});
  return g.sort(function(a,b){return a[0]<b[0]?-1:1});
}
var W=[],G=[];
function rebuild(){W=weeklyAll();G=gfAll()}
function gfNear(d,p,r){var best=null,bd=99;G.forEach(function(g){var dd=dayDiff(g[0],d);if(dd<=6&&dd<bd){bd=dd;best=g}});return best?best[IDX[p][r]]:null}
function flagInfo(d,p,r){
  var t=(D.flags||[]).find(function(f){return f[0]===d&&f[1]===p&&f[2]===r});if(t)return t[3]||L().verify;
  var i=W.findIndex(function(x){return x.r[0]===d});if(i<0)return null;var v=W[i].r[IDX[p][r]];
  if(i>0){var a=W[i-1].r[IDX[p][r]];if(a&&Math.abs(v-a)/a>0.20)return (lang==="vi"?"lệch ":"moved ")+Math.round((v-a)/a*100)+"% "+(lang==="vi"?"so với kỳ ":"vs ")+fmtD(W[i-1].r[0]);}
  var g=gfNear(d,p,r);if(g&&Math.abs(v-g)/g>0.25)return (lang==="vi"?"lệch GreenFeed ":"vs GreenFeed ")+(v>g?"+":"")+Math.round((v-g)/g*100)+"%";
  return null;
}
function weekly(p,r){return W.map(function(x){return {d:x.r[0],v:x.r[IDX[p][r]],o:x.o,flag:flagInfo(x.r[0],p,r)}})}
function monthly(p,r){return MONTHS.map(function(m){var pts=weekly(p,r).filter(function(x){return +x.d.slice(5,7)===m});if(!pts.length)return {m:m,v:null,n:0};var vs=pts.map(function(x){return x.v});return {m:m,v:vs.reduce(function(a,b){return a+b},0)/vs.length,n:vs.length,flag:pts.some(function(x){return x.flag}),min:Math.min.apply(null,vs),max:Math.max.apply(null,vs)}})}
function gfMonthly(p,r){return MONTHS.map(function(m){var pts=G.filter(function(g){return +g[0].slice(5,7)===m&&g[IDX[p][r]]});if(!pts.length)return {m:m,v:null,n:0};var vs=pts.map(function(g){return g[IDX[p][r]]});return {m:m,v:vs.reduce(function(a,b){return a+b},0)/vs.length,n:vs.length}})}
var lastM=function(){return +W[W.length-1].r[0].slice(5,7)};

    return segs.map(function(s){return '<polyline fill="none" stroke="'+c+'" stroke-width="'+w+'"'+(dash?' stroke-dasharray="5 4" opacity=".75"':"")+' stroke-linejoin="round" stroke-linecap="round" points="'+s.map(function(p){return p.x+","+p.y}).join(" ")+'"/>'}).join("")};

  });
  ends.sort(function(a,b){return a.y-b.y});for(var i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<14)ends[i].y=ends[i-1].y+14;

function placeTip(){

function logLine(s){LOGLINES.unshift(new Date().toLocaleTimeString(L().locale)+"  "+s);LOGLINES=LOGLINES.slice(0,80);$("log").innerHTML=LOGLINES.map(function(x){return "<div>"+esc(x)+"</div>"}).join("")}
function setProg(p){$("prog").style.width=Math.round(p*100)+"%"}
function fetchText(url){
  var tries=[url].concat(PROXIES.map(function(p){return p+encodeURIComponent(url)}));
  var i=0;
  function next(){
    if(i>=tries.length)return Promise.reject(new Error("all failed"));
    var u=tries[i++],ctl=window.AbortController?new AbortController():null,tm=setTimeout(function(){if(ctl)ctl.abort()},20000);
    return fetch(u,ctl?{signal:ctl.signal}:{}).then(function(r){clearTimeout(tm);if(!r.ok)throw new Error(r.status);return r.text()}).then(function(tx){if(!tx||tx.length<200)throw new Error("empty");return tx}).catch(function(){return next()});
  }
  return next();
}
function saveLocal(){LOCAL.at=new Date().toISOString();store.set("gsgs26_local",LOCAL)}
function scanNow(extraOnly){
  var core=window.GSGS_CORE,t=L();if(!core){logLine("scanner-core.js ✕");return Promise.resolve()}
  var btn=$("scanNow");btn.disabled=true;$("addBtn").disabled=true;logLine(t.log.start);setProg(.05);
  var have={};W.forEach(function(x){have[x.r[0]]=1});var gfHave={};G.forEach(function(g){gfHave[g[0]]=1});var found=0;
  var p=Promise.resolve();
  if(!extraOnly){
    p=p.then(function(){logLine(t.log.ncn);return fetchText(core.NCN_LIST_PAGES(1)[0]).then(function(h){return core.parseNcnListing(h)}).catch(function(){logLine(t.log.fail("nguoichannuoi.vn"));return []})})
    .then(function(posts){setProg(.3);var todo=posts.filter(function(x){return !have[x.date]&&x.date>="2026-01-01"});if(!todo.length)logLine(t.log.none);
      return todo.reduce(function(q,x){return q.then(function(){return fetchText(x.url).then(function(h){var rec=core.parseNcnTable(h,x.url);if(rec&&[rec.heo.Bac,rec.heo.Trung,rec.heo.Nam].every(core.okPrice)){LOCAL.weekly=(LOCAL.weekly||[]).filter(function(r){return r[0]!==rec.date});LOCAL.weekly.push([rec.date,rec.heo.Bac,rec.heo.Trung,rec.heo.Nam]);found++;logLine(t.log.ncnNew(fmtD(rec.date)))}}).catch(function(){logLine(t.log.fail(x.url))})})},Promise.resolve())})
    .then(function(){setProg(.55);logLine(t.log.gf);return fetchText(core.GF_URL()).then(function(h){
      var dates=core.parseGfDates(h).filter(function(d){return !gfHave[d]&&d>="2026-01-01"}).slice(-6);
      var first=core.parseGfTable(h,core.GF_URL());var n=0;
      if(first&&first.date&&!gfHave[first.date]){addGf(first);n++;dates=dates.filter(function(d){return d!==first.date})}
      return dates.reduce(function(q,d){return q.then(function(){return fetchText(core.GF_URL(d)).then(function(h2){var r=core.parseGfTable(h2,core.GF_URL(d));if(r){r.date=d;addGf(r);n++}}).catch(function(){})})},Promise.resolve()).then(function(){if(n){found+=n;logLine(t.log.gfNew(n))}});
    }).catch(function(){logLine(t.log.fail("greenfeed.com.vn"))})});
  }
  p=p.then(function(){
    var list=LOCALSRC.slice();if(!list.length)return;logLine(t.log.extra(list.length));
    return list.reduce(function(q,s,i){return q.then(function(){setProg(.6+.35*i/list.length);var k=core.classify(s.url);
      return fetchText(s.url).then(function(h){
        if(k==="ncn-table"){var rec=core.parseNcnTable(h,s.url);if(rec&&!have[rec.date]&&[rec.heo.Bac,rec.heo.Trung,rec.heo.Nam].every(core.okPrice)){LOCAL.weekly=(LOCAL.weekly||[]).filter(function(r){return r[0]!==rec.date});LOCAL.weekly.push([rec.date,rec.heo.Bac,rec.heo.Trung,rec.heo.Nam]);found++;logLine(t.log.ncnNew(fmtD(rec.date)))}}
        else if(k==="ncn-list"){/* danh mục: chỉ ghi nhận, quét bảng ở lượt chính */}
        else if(k==="gf-table"){var r=core.parseGfTable(h,s.url);if(r&&!gfHave[r.date]){addGf(r);found++}}
        else if(k==="rss"){var it=core.parseRss(h).filter(function(n){return /heo|lợn|bò|trâu|gia súc/i.test(n.title)}).map(function(n){n.source=n.source||s.name;return n});LOCAL.news=it.concat((LOCAL.news||[]).filter(function(n){return !it.some(function(m){return m.title===n.title})})).slice(0,40);logLine((s.name||s.url)+": "+it.length+" tin")}
        else{var m=core.extractMentions(h,s.url,8);m.name=s.name||m.title;m.local=true;LOCAL.mentions=[m].concat((LOCAL.mentions||[]).filter(function(x){return x.url!==s.url}));logLine((s.name||m.title||s.url)+": "+m.mentions.length+(lang==="vi"?" câu có giá":" price quote(s)"))}
      }).catch(function(){logLine(t.log.fail(s.url))})})},Promise.resolve());
  });
  return p.then(function(){saveLocal();setProg(1);logLine(t.log.done(found));btn.disabled=false;$("addBtn").disabled=false;rebuild();drawAll();setTimeout(function(){setProg(0)},1500)});
}
