<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dịch bệnh gia súc Việt Nam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root,[data-theme="dark"]{
  --bg:#070c19;--panel:#0f172b;--panel2:#16213b;--ink:#eaf0ff;--muted:#8d9cbd;--line:#243152;
  --sea1:#0a1a36;--sea2:#030814;--land:#2b3d6b;--landline:#6a86c9;
  --red:#ff2e4d;--red-bg:rgba(255,46,77,.16);--amber:#ffb020;--amber-bg:rgba(255,176,32,.16);
  --nb:#a36bff;--hist:#29c5f6;--ok:#27d196;--accent:#4f8cff;--accent2:#7c4dff;
  --shadow:0 8px 28px rgba(0,0,0,.45);--isl:#bcd6ff;
}
[data-theme="light"]{
  --bg:#eef2f9;--panel:#ffffff;--panel2:#f4f7fc;--ink:#101a33;--muted:#5a6a8a;--line:#d7deeb;
  --sea1:#cfe4f7;--sea2:#b7d3ee;--land:#f7f9fc;--landline:#8193b7;
  --red-bg:#ffe3e8;--amber-bg:#fff2d6;--shadow:0 6px 20px rgba(20,40,80,.12);--isl:#0d3b7a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif}
header{padding:14px 18px;background:linear-gradient(110deg,#03201a 0%,#0b3d2e 35%,#6b3d0a 72%,#b3121f 100%);color:#fff;
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
h1 .dot{width:12px;height:12px;border-radius:50%;background:#ff4d63;box-shadow:0 0 0 0 rgba(255,77,99,.8);animation:pulse 1.6s infinite}
header .sub{color:#ffd6dc;font-size:12px}
header input[type=date]{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:5px 8px;color-scheme:dark}
.wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;padding:14px 18px;align-items:start}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.card h2{font-size:14px;font-weight:700;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2)}
.card h2::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--red),var(--accent2));margin-right:8px}
.card h2 .t{display:flex;align-items:center;flex:1}
.card .body{padding:12px 14px}
.maptools{display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2);align-items:center}
#mapBox{position:relative}
#map{height:80vh;min-height:560px;background:radial-gradient(ellipse at 60% 40%,var(--sea1),var(--sea2))}
.leaflet-container{font:inherit;background:transparent}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border-radius:12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
.kpi b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c,var(--ink))}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
button,select,input{font:inherit;color:inherit}
button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
button.ghost,.tbtn{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.tbtn{border-radius:18px;padding:4px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn input{display:none}
header button{background:#fff;color:#8a0f22}
header .tbtn{border-color:rgba(255,255,255,.4);color:#fff}
button:disabled{opacity:.5;cursor:wait}
.search{position:relative}
.search input{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:4px 12px;width:170px;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{max-height:320px;overflow:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-grey{border:1px solid var(--line);color:var(--muted)}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:800;color:#111;letter-spacing:.2px}
.legend,.info{background:rgba(15,23,43,.92);color:#eaf0ff;padding:10px 12px;border-radius:10px;border:1px solid #2d3b63;font-size:12px;line-height:1.75;box-shadow:var(--shadow);backdrop-filter:blur(4px)}
[data-theme="light"] .legend,[data-theme="light"] .info{background:rgba(255,255,255,.95);color:#101a33;border-color:#d7deeb}
.info{min-width:210px}
.info h4{margin:0 0 2px;font-size:14px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:7px;vertical-align:-2px}
.isl{color:var(--isl);font-weight:700;font-size:11px;white-space:nowrap;text-align:center;letter-spacing:.5px}
/* nhãn tỉnh có dịch */
.plabel{pointer-events:none}
.plabel .box{transform:translate(-50%,-100%);display:inline-flex;flex-direction:column;align-items:center;white-space:nowrap}
.plabel .nm{display:inline-flex;align-items:center;gap:5px;background:rgba(8,10,22,.9);color:#fff;font-weight:800;font-size:11.5px;padding:2px 4px 2px 8px;border-radius:7px;border:1.5px solid var(--bc,#ff2e4d);box-shadow:0 0 14px var(--bc,#ff2e4d)}
.plabel .st{display:flex;gap:3px}
.plabel .tail{width:2px;height:9px;background:var(--bc,#ff2e4d)}
.pulse{width:16px;height:16px;border-radius:50%;background:var(--red);border:2px solid #fff;animation:pulse 1.6s infinite}
.pulse.amber{background:var(--amber);animation-name:pulseA}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,46,77,.8)}70%{box-shadow:0 0 0 18px rgba(255,46,77,0)}100%{box-shadow:0 0 0 0 rgba(255,46,77,0)}}
@keyframes pulseA{0%{box-shadow:0 0 0 0 rgba(255,176,32,.8)}70%{box-shadow:0 0 0 16px rgba(255,176,32,0)}100%{box-shadow:0 0 0 0 rgba(255,176,32,0)}}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.leaflet-popup-content{margin:12px 14px;min-width:270px}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--line)}
.pop h3{margin:0 0 6px;font-size:16px;font-weight:800}
.pop .ob{border-top:1px dashed var(--line);padding-top:7px;margin-top:7px}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:4px 0;font-size:12.5px}
.pop dt{color:var(--muted)}.pop dd{margin:0;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--amber))}
.log{font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);max-height:120px;overflow:auto;white-space:pre-wrap}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.grid label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
form.grid input,form.grid select{padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:11.5px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
a{color:var(--accent)}
#mapBox:fullscreen #map{height:100vh}
@media print{header .row,.maptools,details{display:none}.wrap{grid-template-columns:1fr}}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.45);border-radius:18px;overflow:hidden}
.lang button{background:transparent;color:#fff;border-radius:0;padding:4px 11px;font-size:12px;font-weight:700}
.lang button.on{background:#fff;color:#8a0f22}
header a.nav.back{background:#fff;color:#8a0f22;font-weight:700}
header a.nav{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.45);border-radius:18px;padding:4px 11px;font-size:12px;font-weight:600}
.src-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px}
@media(max-width:520px){.src-grid{grid-template-columns:1fr}}
.src-grid label{display:flex;gap:6px;align-items:flex-start}
.src-grid small{color:var(--muted);display:block}
textarea{width:100%;min-height:70px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;font:12px/1.4 ui-monospace,Consolas,monospace}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--red));transition:width .3s}
.st-c{background:rgba(79,140,255,.16);color:#7fb0ff}
.st-l{background:rgba(39,209,150,.16);color:var(--ok)}
.st-g{background:rgba(255,176,32,.16);color:var(--amber)}
.st-o{border:1px solid var(--line);color:var(--muted)}
.srcstat{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
@media(max-width:600px){.wrap{padding:8px;gap:10px}header{padding:10px 12px}h1{font-size:16px}.info.leaflet-control{display:none}.card h2{flex-wrap:wrap}.card h2 .t{flex:1 1 100%}.maptools{padding:8px}.kpi b{font-size:20px}}
</style>
</head>
<body>
<header>
  <div>
    <h1><span class="dot"></span><span data-i18n="title"></span></h1>
    <div class="sub" data-i18n="subtitle"></div>
  </div>
  <div class="row">
    <span class="sub" data-i18n="refDate"></span><input type="date" id="refDate">
    <button id="btnScan" data-i18n="scan"></button>
    <label class="tbtn on"><input type="checkbox" id="autoScan" checked><span data-i18n="auto"></span></label>
    <button class="ghost tbtn" id="btnTheme" style="color:#fff"></button>
    <a class="nav back" href="https://avian-influenza-situation.blogspot.com/" target="_top" data-i18n="back"></a>
    <a class="nav" href="the-gioi.html" data-i18n="toWorld"></a>
    <a class="nav" href="../cum-gia-cam/" data-i18n="toAI"></a>
    <div class="lang" title="Ngôn ngữ / Language"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2><span class="t" data-i18n="mapTitle"></span><span class="note" id="scanStatus"></span></h2>
    <div class="maptools">
      <div class="search"><input id="q" list="dl" data-i18n-ph="searchPh"><datalist id="dl"></datalist></div>
      <label class="tbtn on"><input type="checkbox" id="optLabel" checked><span data-i18n="optLabel"></span></label>
      <label class="tbtn on"><input type="checkbox" id="optPulse" checked><span data-i18n="optPulse"></span></label>
      <label class="tbtn"><input type="checkbox" id="optNb"><span data-i18n="optNb"></span></label>
      <label class="tbtn"><input type="checkbox" id="optHist"><span data-i18n="optHist"></span></label>
      <span class="note" style="margin-left:4px" data-i18n="strain"></span><span id="strainF" class="row" style="gap:5px"></span>
      <span style="flex:1"></span>
      <button class="ghost tbtn" id="btnReset" data-i18n="reset"></button>
      <button class="ghost tbtn" id="btnFull" data-i18n="full"></button>
      <button class="ghost tbtn" id="btnPrint" data-i18n="print"></button>
    </div>
    <div id="mapBox"><div id="map"></div></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <div class="card">
      <h2><span class="t" data-i18n="overview"></span></h2>
      <div class="body">
        <div class="kpis">
          <div class="kpi" style="--c:var(--red)"><b id="kProv">0</b><span data-i18n="kProv"></span></div>
          <div class="kpi" style="--c:var(--amber)"><b id="kSick">0</b><span data-i18n="kSick"></span></div>
          <div class="kpi" style="--c:#ff6b8b"><b id="kDead">0</b><span data-i18n="kDead"></span></div>
          <div class="kpi" style="--c:var(--nb)"><b id="kCull">0</b><span data-i18n="kCull"></span></div>
        </div>
        <p class="note" id="kNote" style="margin:10px 0 0"></p>
      </div>
    </div>

    <div class="card">
      <h2><span class="t" data-i18n="activeTitle"></span></h2>
      <div class="body scroll"><table id="tActive"></table></div>
    </div>

    <div class="card">
      <h2><span class="t" data-i18n="newsTitle"></span><span class="note" id="newsCount"></span></h2>
      <div class="body">
        <div class="row" style="gap:5px;margin-bottom:6px" id="newsFilter"></div>
        <div class="scroll"><table id="tNews"></table></div>
        <div class="prog"><i id="progBar"></i></div>
        <details><summary data-i18n="logTitle"></summary><div class="srcstat" id="srcStat"></div><div class="log" id="log"></div></details>
      </div>
    </div>

    <div class="card">
      <h2><span class="t" data-i18n="srcTitle"></span><span class="note" id="srcCount"></span></h2>
      <div class="body">
        <div class="src-grid" id="srcGrid"></div>
        <details style="margin-top:6px"><summary data-i18n="customTitle"></summary>
          <p class="note" data-i18n="customHelp"></p>
          <textarea id="customSrc" spellcheck="false"></textarea>
          <div class="row" style="margin-top:6px"><button id="btnSaveSrc" data-i18n="saveSrc"></button><span class="note" id="srcSaved"></span></div>
        </details>
      </div>
    </div>

    <div class="card">
      <h2><span class="t" data-i18n="verTitle"></span><span class="row" style="gap:6px"><button class="ghost tbtn" id="btnExport" data-i18n="export"></button><label class="tbtn"><input type="file" id="fileImport" accept=".json"><span data-i18n="import"></span></label></span></h2>
      <div class="body">
        <div class="scroll"><table id="tAll"></table></div>
        <details><summary data-i18n="addTitle"></summary>
          <form class="grid" id="frm">
            <label><span data-i18n="fProv"></span><select name="prov" id="selProv" required></select></label>
            <label><span data-i18n="fArea"></span><input name="area"></label>
            <label><span data-i18n="fDate"></span><input type="date" name="date" required></label>
            <label><span data-i18n="fStrain"></span><select name="strain" id="selStrain"></select></label>
            <label><span data-i18n="fSick"></span><input type="number" min="0" name="sick"></label>
            <label><span data-i18n="fDead"></span><input type="number" min="0" name="dead"></label>
            <label><span data-i18n="fCull"></span><input type="number" min="0" name="cull"></label>
            <label><span data-i18n="fUrl"></span><input name="url" type="url"></label>
            <label style="grid-column:1/-1"><span data-i18n="fNote"></span><input name="note"></label>
            <div class="row" style="grid-column:1/-1"><button type="submit" data-i18n="save"></button><span class="note" data-i18n="saveNote"></span></div>
          </form>
        </details>
      </div>
    </div>

    <div class="card">
      <h2><span class="t" data-i18n="ctxTitle"></span></h2>
      <div class="body" style="font-size:12.5px" id="ctxBody"></div>
    </div>
  </div>
</div>

function applyStatic(){
  document.documentElement.lang=LANG; document.title=LANG==="vi"?"Dịch bệnh gia súc Việt Nam":"Livestock Disease – Vietnam";

  document.querySelectorAll("[data-i18n-ph]").forEach(e=>e.placeholder=t(e.dataset.i18nPh));
  document.querySelectorAll(".lang button").forEach(b=>b.classList.toggle("on",b.dataset.lang===LANG));
  btnTheme.textContent=document.documentElement.dataset.theme==="dark"?t("light"):t("dark");
  ctxBody.innerHTML=t("ctx");
}

function buildQueries(){
  const qs=[]; for(const k in GROUPS) if(GROUPS[k].on) qs.push(...GROUPS[k].build());

function findProv(text){const tt=" "+strip(text).replace(/[^a-z0-9. ]/g," ")+" ";let best=null,bi=1e9;

function provStatus(name){
  const rs=records.filter(r=>r.prov===name&&strainOn.has(r.strain||"Chưa xác định")).map(r=>({...r,ds:daysSince(r.date)})).filter(r=>r.ds>=0).sort((a,b)=>a.ds-b.ds);
  const ns=[...rs.filter(r=>r.susp&&r.ds<=WINDOW).map(r=>({...r,type:"o",title:noteOf(r),link:r.url})),...news.filter(n=>n.prov===name&&!n.over&&n.ds>=0&&n.ds<=WINDOW&&strainOn.has(n.strain))];
  const active=rs.filter(r=>r.ds<=WINDOW&&!r.susp),hist=rs.filter(r=>r.ds>WINDOW&&r.ds<=HIST&&!r.susp);
  const level=active.length?"red":ns.length?"amber":"none";
  return {rs,active,ns,hist,level,last:rs[0],strains:[...new Set((active.length?active:ns).map(r=>r.strain))]};
}
function allStatus(){const m={};PROVS.forEach(p=>m[p]=provStatus(p));const nb=new Set();
  PROVS.forEach(p=>{if(m[p].level==="red")(PROP[p].adj||[]).forEach(a=>{if(m[a].level==="none")nb.add(a);});});return {m,nb};}

  if(s.level==="red")return {...base,fillColor:COL.red,fillOpacity:.9,color:"#ffd0d6",weight:1.4};
  if(s.level==="amber")return {...base,fillColor:COL.amber,fillOpacity:.85,color:"#ffe7b3",weight:1.2};
  if(opt("optNb")&&ST.nb.has(n))return {...base,fillColor:COL.nb,fillOpacity:.45,color:COL.nb,weight:1.4,dashArray:"4 3"};
  if(opt("optHist")&&s.hist.length)return {...base,fillColor:COL.hist,fillOpacity:.25,color:COL.hist,weight:1.4,dashArray:"2 3"};
  return base;}
function obHTML(r,auto){
  const left=WINDOW-r.ds,pct=Math.min(100,Math.max(0,r.ds/WINDOW*100)),end=new Date(new Date(r.date).getTime()+WINDOW*DAY).toISOString().slice(0,10);
  return `<div class="ob">${auto?(r.susp?`<b style="color:var(--amber)">${t("susp")}</b>`:`<b style="color:var(--amber)">${t("autoNews")}</b> <span class="badge st-${r.type}">${t("t"+r.type.toUpperCase())}</span>`):""}
   <div class="row" style="gap:6px;margin-bottom:3px">${chip(r.strain)}<b style="font-size:12px">${esc(strainFull(r.strain))}</b><span class="note">${esc(r.area||r.dom||"")}</span></div>
   <dl><dt>${r.susp?t("dDetect"):auto?t("dPost"):r.dt==="status"?t("dStatus"):r.dt==="pub"?t("dPost"):t("dDetect")}</dt><dd>${fmtD(r.date)} · ${t("ago",{d:r.ds})}</dd>
   <dt>${t("sick")}</dt><dd>${fmtN(r.sick)}</dd><dt>${t("dead")}</dt><dd>${fmtN(r.dead)}</dd><dt>${t("cull")}</dt><dd>${fmtN(r.cull)}</dd>${r.kg?`<dt>${t("kg")}</dt><dd>${fmtNum(r.kg)} kg</dd>`:""}</dl>
   <div class="bar"><i style="width:${pct}%"></i></div>
   <div class="note">${left>=0?t("left",{d:left,e:fmtD(end)}):t("passed")}</div>
   ${(!auto||r.susp)&&noteOf(r)?`<div class="note" style="margin-top:3px">${esc(noteOf(r))}</div>`:""}
   ${(r.url||r.link)?`<a href="${esc(r.url||r.link)}" target="_blank">${auto?esc(r.title):t("src")+": "+esc(r.src||"link")}</a>`:""}</div>`;}
function popupHTML(name){const s=ST.m[name];
  const st=s.level==="red"?`<span class="badge b-red">${t("stRed")}</span>`:s.level==="amber"?`<span class="badge b-amber">${t("stAmber")}</span>`
    :ST.nb.has(name)?`<span class="badge" style="background:rgba(163,107,255,.18);color:${COL.nb}">${t("stNb")}</span>`:`<span class="badge b-grey">${t("stNone")}</span>`;
  let h=`<div class="pop"><h3>${esc(name)}</h3>${st}`;
  if(PROP[name].sn&&PROP[name].sn!==name)h+=`<div class="note" style="margin-top:4px">${t("merged")}: ${esc(PROP[name].sn)}</div>`;
  s.active.forEach(r=>h+=obHTML(r)); s.ns.slice(0,3).forEach(n=>h+=obHTML(n,true));
  if(!s.active.length&&!s.ns.length&&s.last)h+=`<div class="note" style="margin-top:6px">${t("lastRef")}</div>`+obHTML(s.last);
  if(ST.nb.has(name))h+=`<div class="note" style="margin-top:6px">${t("borders")}: ${PROP[name].adj.filter(a=>ST.m[a].level==="red").map(esc).join(", ")}</div>`;
  return h+"</div>";}
const layer=L.geoJSON(VN_GEO,{style:styleF,onEachFeature:(f,l)=>{
  l.on("click",()=>l.bindPopup(popupHTML(f.properties.ten),{maxWidth:360}).openPopup());
  l.on("mouseover",()=>{l.setStyle({weight:2.5,color:"#fff"});l.bringToFront();info.update(f.properties.ten);});
  l.on("mouseout",()=>{layer.resetStyle(l);info.update();});}}).addTo(map);
const HOME=layer.getBounds();map.fitBounds(HOME,{padding:[10,10]});
const islLayer=L.layerGroup().addTo(map);
function drawIslands(){islLayer.clearLayers();
  [[16.45,111.9,t("hoang"),160],[10.2,114.4,t("truong"),170],[14.0,112.6,`<i style='font-weight:400;font-size:14px;opacity:.7'>${t("sea")}</i>`,160]]
  .forEach(([la,lo,h,w])=>L.marker([la,lo],{interactive:false,icon:L.divIcon({className:"isl",html:h,iconSize:[w,30],iconAnchor:[w/2,15]})}).addTo(islLayer));}
const info=L.control({position:"topright"});
info.onAdd=function(){this._d=L.DomUtil.create("div","info");this.update();return this._d;};
info.update=function(n){if(!this._d)return;
  if(!n){this._d.innerHTML=`<h4>${t("hover")}</h4><span class="note">${t("hoverSub")}</span>`;return;}
  const s=ST.m[n];const tag=s.level==="red"?`<b style="color:${COL.red}">${t("shRed")}</b>`:s.level==="amber"?`<b style="color:${COL.amber}">${t("shAmber")}</b>`
    :ST.nb.has(n)?`<b style="color:${COL.nb}">${t("shNb")}</b>`:`<span class="note">${t("shNone")}</span>`;
  this._d.innerHTML=`<h4>${esc(n)}</h4>${tag}${s.strains.length?"<br>"+s.strains.map(chip).join(" "):""}${s.active[0]?`<br><span class="note">${t("detectedLeft",{d:fmtD(s.active[0].date),n:WINDOW-s.active[0].ds})}</span>`:""}`;};
info.addTo(map);
const lg=L.control({position:"bottomright"});
lg.onAdd=function(){this._d=L.DomUtil.create("div","legend");L.DomEvent.disableClickPropagation(this._d);this.update();return this._d;};
lg.update=function(){if(!this._d)return;const hidden=this._d.querySelector("div")?.hidden;
  this._d.innerHTML=`<b style="cursor:pointer" onclick="this.nextElementSibling.hidden=!this.nextElementSibling.hidden">${t("lgTitle")} ▾</b><div${hidden?" hidden":""}>
  <span class="sw" style="background:${COL.red};box-shadow:0 0 8px ${COL.red}"></span>${t("lgRed")}<br>
  <span class="sw" style="background:${COL.amber}"></span>${t("lgAmber")}<br><span class="sw" style="background:${COL.nb};opacity:.7"></span>${t("lgNb")}<br>
  <span class="sw" style="border:2px dashed ${COL.hist}"></span>${t("lgHist")}<br><div style="margin-top:4px">${Object.keys(STRAINS).map(chip).join(" ")}</div></div>`;};
lg.addTo(map);
const labelLayer=L.layerGroup().addTo(map),pulseLayer=L.layerGroup().addTo(map);
function drawLabels(){labelLayer.clearLayers();pulseLayer.clearLayers();
  PROVS.forEach(n=>{const s=ST.m[n];if(s.level==="none")return;const p=PROP[n],c=s.level==="red"?COL.red:COL.amber;
    if(opt("optPulse"))L.marker([p.lat,p.lon],{icon:L.divIcon({className:"",html:`<div class="pulse ${s.level==="amber"?"amber":""}"></div>`,iconSize:[16,16],iconAnchor:[8,8]}),keyboard:false}).on("click",()=>zoomTo(n)).addTo(pulseLayer);
    if(opt("optLabel"))L.marker([p.lat,p.lon],{interactive:false,icon:L.divIcon({className:"plabel",iconSize:[0,0],
      html:`<div class="box" style="--bc:${c}"><span class="nm">${esc(n)}${s.level==="amber"?" ?":""}<span class="st">${s.strains.map(chip).join("")}</span></span><span class="tail"></span></div>`})}).addTo(labelLayer);});}
function zoomTo(n){layer.eachLayer(l=>{if(l.feature.properties.ten===n){map.fitBounds(l.getBounds(),{maxZoom:8,padding:[30,30]});l.bindPopup(popupHTML(n),{maxWidth:360}).openPopup();}});}

/* ===== CÔNG CỤ ===== */
document.getElementById("dl").innerHTML=PROVS.map(p=>`<option value="${esc(p)}">`).join("");
q.addEventListener("change",()=>{const v=q.value.trim();const n=PROVS.find(p=>strip(p)===strip(v))||findProv(v);if(n){zoomTo(n);q.value="";}});
function drawStrainF(){strainF.innerHTML=Object.keys(STRAINS).map(s=>`<label class="tbtn ${strainOn.has(s)?"on":""}" style="padding:2px 6px"><input type="checkbox" data-s="${esc(s)}" ${strainOn.has(s)?"checked":""}>${chip(s)}</label>`).join("");}
strainF.addEventListener("change",e=>{const s=e.target.dataset.s;if(!s)return;e.target.checked?strainOn.add(s):strainOn.delete(s);e.target.parentElement.classList.toggle("on",e.target.checked);render();});
document.querySelectorAll("header .tbtn input,.maptools .tbtn input").forEach(i=>i.addEventListener("change",()=>i.parentElement.classList.toggle("on",i.checked)));
["optLabel","optPulse","optNb","optHist"].forEach(id=>document.getElementById(id).addEventListener("change",render));
btnReset.onclick=()=>map.fitBounds(HOME,{padding:[10,10]});
btnFull.onclick=()=>{const b=document.getElementById("mapBox");document.fullscreenElement?document.exitFullscreen():b.requestFullscreen?.();setTimeout(()=>map.invalidateSize(),300);};
document.addEventListener("fullscreenchange",()=>setTimeout(()=>map.invalidateSize(),200));
btnPrint.onclick=()=>window.print();
btnTheme.onclick=()=>{const r=document.documentElement;r.dataset.theme=r.dataset.theme==="dark"?"light":"dark";try{localStorage.setItem("cgc_theme",r.dataset.theme);}catch(e){}applyStatic();render();};
try{if(localStorage.getItem("cgc_theme")==="light")document.documentElement.dataset.theme="light";}catch(e){}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{LANG=b.dataset.lang;try{localStorage.setItem("cgc_lang",LANG);}catch(e){}
  applyStatic();drawSrc();drawStrainF();drawSel();drawIslands();lg.update();map.closePopup();render();if(!lastScan)scanStatus.textContent=t("notScanned");else setScanStatus();});

/* ===== NGUỒN QUÉT – GIAO DIỆN ===== */
function drawSrc(){
  srcGrid.innerHTML=Object.keys(GROUPS).map(k=>`<label><input type="checkbox" data-g="${k}" ${GROUPS[k].on?"checked":""}><span><b>${t("s_"+k)}</b><small>${t("s_"+k+"_d",{n:GROUPS[k].n||""})}</small></span></label>`).join("");
  srcCount.textContent=t("srcCount",{n:buildQueries().length});
  customSrc.value=CUSTOM.join("\n");}
srcGrid.addEventListener("change",e=>{const g=e.target.dataset.g;if(!g)return;GROUPS[g].on=e.target.checked;
  try{localStorage.setItem("gsvn_groups",JSON.stringify(Object.fromEntries(Object.entries(GROUPS).map(([k,v])=>[k,v.on]))));}catch(_){}
  srcCount.textContent=t("srcCount",{n:buildQueries().length});});
btnSaveSrc.onclick=()=>{CUSTOM=customSrc.value.split(/\n+/).map(s=>s.trim().replace(/^https?:\/\/(?=[^/]+\/?$)/,"").replace(/\/$/,"")).filter(Boolean);
  try{localStorage.setItem("gsvn_custom",JSON.stringify(CUSTOM));}catch(_){}srcSaved.textContent=t("saved")+" ("+CUSTOM.length+")";drawSrc();};

/* ===== BẢNG & KPI ===== */
function render(){
  ST=allStatus();layer.setStyle(styleF);drawLabels();
  const act=PROVS.filter(p=>ST.m[p].level!=="none").sort((a,b)=>ST.m[a].level===ST.m[b].level?0:ST.m[a].level==="red"?-1:1);
  let sick=0,dead=0,cull=0,miss=false;
  act.forEach(p=>ST.m[p].active.forEach(r=>{if(r.sick==null||r.dead==null||r.cull==null)miss=true;sick+=+r.sick||0;dead+=+r.dead||0;cull+=+r.cull||0;}));
  kProv.textContent=act.filter(p=>ST.m[p].level==="red").length;kSick.textContent=fmtNum(sick);kDead.textContent=fmtNum(dead);kCull.textContent=fmtNum(cull);
  const nA=act.filter(p=>ST.m[p].level==="amber").length;
  kNote.innerHTML=t("kNote",{d:fmtD(refInput.value)})+(miss?t("kMiss"):"")+(nA?t("kAmber",{n:nA}):"")+(ST.nb.size?t("kNb",{n:ST.nb.size,c:COL.nb}):"")+".";
  tActive.innerHTML=`<tr><th>${t("thProv")}</th><th>${t("thStrain")}</th><th>${t("thStatus")}</th><th>${t("thDate")}</th><th class="n">${t("thSick")}</th><th class="n">${t("thDead")}</th><th class="n">${t("thCull")}</th></tr>`+
   (act.length?act.map(p=>{const s=ST.m[p],r=s.active[0]||s.ns[0],red=s.level==="red";
    return `<tr><td><a href="#" data-p="${esc(p)}"><b>${esc(p)}</b></a></td><td>${s.strains.map(chip).join(" ")}</td>
    <td>${red?`<span class="badge b-red">${t("daysLeft",{d:WINDOW-r.ds})}</span>`:`<span class="badge b-amber">${t("verify")}</span>`}</td>
    <td>${fmtD(r.date)}</td><td class="n">${fmtN(r.sick)}</td><td class="n">${fmtN(r.dead)}</td><td class="n">${fmtN(r.cull)}</td></tr>`}).join("")
   :`<tr><td colspan="7" class="note">${t("noActive")}</td></tr>`);
  tAll.innerHTML=`<tr><th>${t("thDetect")}</th><th>${t("thArea")}</th><th>${t("thStrain")}</th><th class="n">${t("thSick")}</th><th class="n">${t("thDead")}</th><th class="n">${t("thCull")}</th><th></th></tr>`+
   records.slice().sort((a,b)=>b.date.localeCompare(a.date)).map(r=>{const ds=daysSince(r.date);
    return `<tr><td>${fmtD(r.date)}<br>${ds<=WINDOW&&ds>=0?`<span class="badge b-red">${t("le21")}</span>`:`<span class="badge b-grey">${t("days",{d:ds})}</span>`}</td>
    <td><a href="#" data-p="${esc(r.prov)}"><b>${esc(r.prov)}</b></a><br><span class="note">${esc(r.area||"")}</span></td><td>${chip(r.strain)}</td>
    <td class="n">${fmtN(r.sick)}</td><td class="n">${fmtN(r.dead)}</td><td class="n">${fmtN(r.cull)}</td>
    <td>${r.url?`<a href="${esc(r.url)}" target="_blank">${t("srcLink")}</a><br>`:""}<a href="#" data-del="${esc(r.id)}">${t("del")}</a></td></tr>`}).join("");
  const types=["all","c","l","g","o"];
  newsFilter.innerHTML=types.map(x=>{const c=x==="all"?news.length:news.filter(n=>n.type===x).length;
    return `<label class="tbtn ${newsTypeF===x?"on":""}" style="padding:2px 8px"><input type="radio" name="nf" value="${x}">${x==="all"?t("all"):t("t"+x.toUpperCase())} (${c})</label>`;}).join("");
  const shown=news.map((n,i)=>({n,i})).filter(x=>newsTypeF==="all"||x.n.type===newsTypeF);
  tNews.innerHTML=`<tr><th>${t("thPost")}</th><th>${t("thProv")}</th><th>${t("thNews")}</th><th>${t("thExtract")}</th><th></th></tr>`+
   (shown.length?shown.map(({n,i})=>`<tr><td>${fmtD(n.date)}<br><span class="badge ${n.ds<=WINDOW&&!n.over?"b-amber":"b-grey"}">${t("days",{d:n.ds})}</span></td>
    <td>${esc(n.prov)}</td><td><a href="${esc(n.link)}" target="_blank">${esc(n.title)}</a><br><span class="badge st-${n.type}">${t("t"+n.type.toUpperCase())}</span> <span class="note">${esc(n.dom||"")}</span>${n.over?` <span class="badge b-grey">${t("mentionOver")}</span>`:""}</td>
    <td class="note">${chip(n.strain)}<br>${t("thSick")[0]}:${n.sick??"–"} · ${t("thDead")[0]}:${n.dead??"–"} · ${LANG==="vi"?"TH":"Cu"}:${n.cull??"–"}${n.kg?"<br>"+fmtNum(n.kg)+" kg":""}</td>
    <td><a href="#" data-add="${i}">${t("toVerify")}</a></td></tr>`).join("")
   :`<tr><td colspan="5" class="note">${t("noNews")}</td></tr>`);
  info.update();
}
newsFilter.addEventListener("change",e=>{if(e.target.name==="nf"){newsTypeF=e.target.value;render();}});
document.addEventListener("click",e=>{const a=e.target.closest("a[data-p],a[data-del],a[data-add]");if(!a)return;e.preventDefault();
  if(a.dataset.p){zoomTo(a.dataset.p);document.getElementById("map").scrollIntoView({behavior:"smooth",block:"center"});}
  if(a.dataset.del){records=records.filter(r=>r.id!==a.dataset.del);save();render();}
  if(a.dataset.add){const n=news[+a.dataset.add],f=frm;f.prov.value=n.prov;f.date.value=n.date;f.strain.value=STRAINS[n.strain]?n.strain:"Chưa xác định";
    f.sick.value=n.sick??"";f.dead.value=n.dead??"";f.cull.value=n.cull??"";f.url.value=n.link;f.note.value=n.title+(n.kg?" ("+n.kg+" kg)":"");f.closest("details").open=true;f.scrollIntoView({behavior:"smooth"});}});

/* ===== FORM ===== */
selProv.innerHTML=PROVS.map(p=>`<option>${esc(p)}</option>`).join("");
const drawSel=()=>{selStrain.innerHTML=Object.keys(STRAINS).map(s=>`<option value="${s}">${esc(strainFull(s))}</option>`).join("");};drawSel();
frm.addEventListener("submit",e=>{e.preventDefault();const f=Object.fromEntries(new FormData(frm));const num=v=>v===""?null:+v;let src="";try{src=f.url?new URL(f.url).hostname:"";}catch(_){}
  records.push({id:"u"+Date.now(),prov:f.prov,area:f.area,date:f.date,strain:f.strain,sick:num(f.sick),dead:num(f.dead),cull:num(f.cull),url:f.url,src,note:f.note});save();render();frm.reset();});
btnExport.onclick=()=>{const b=new Blob([JSON.stringify(records,null,1)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="avian-flu-outbreaks-"+refInput.value+".json";a.click();};
fileImport.onchange=async e=>{try{const r=JSON.parse(await e.target.files[0].text());if(Array.isArray(r)){records=r;save();render();}}catch(err){log(t("badJson"));}};
refInput.onchange=()=>{news.forEach(n=>n.ds=daysSince(n.date));render();};

/* ===== QUÉT TIN TỰ ĐỘNG =====
   Google News & Bing News (RSS), lọc theo tên miền: báo trung ương, báo 34 tỉnh, cổng *.gov.vn; RSS trực tiếp; nguồn tùy chỉnh.
   Trình duyệt chặn đọc chéo domain (CORS) → đi qua proxy công cộng, thử lần lượt. */
const PROXIES=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://corsproxy.io/?url="+encodeURIComponent(u),u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u)];
const logEl=document.getElementById("log");const log=m=>{logEl.textContent=`[${new Date().toLocaleTimeString(LOC())}] ${m}\n`+logEl.textContent;};
async function getXML(url){for(const px of PROXIES){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),12000);
  const r=await fetch(px(url),{signal:ctl.signal});clearTimeout(tm);if(!r.ok)continue;const x=new DOMParser().parseFromString(await r.text(),"text/xml");if(x.querySelector("item"))return x;}catch(e){}}return null;}
const KW=/dich ta lon|ta heo|dich ta chau phi|lo mom long mong|viem da noi cuc|tai xanh|tu huyet trung|benh dai|dich benh gia suc/,OUTBREAK=/o dich|phat hien|xuat hien|duong tinh|cong bo dich|tieu huy|bung phat|chet|mac benh|lay lan/;
const FOREIGN=/dai loan|trung quoc|my |hoa ky|uc |australia|victoria|campuchia|nhat ban|han quoc|chau au|sec |an do|philippines|thai lan|indonesia/;
const toNum=s=>{if(!s)return null;const n=+s.replace(/[.,](?=\d{3}\b)/g,"").replace(",",".");return isFinite(n)?Math.round(n):null;};
function extract(raw){const tx=raw.toLowerCase().normalize("NFC").replace(/huỷ/g,"hủy");const sx=strip(raw);const g=re=>{const m=tx.match(re);return m?toNum(m[1]):null;};
  const D=[[/dich ta (lon|heo) chau phi|dtlcp|ta (lon|heo) chau phi|dich ta chau phi/,"DTLCP"],[/lo mom long mong|lmlm/,"LMLM"],[/viem da noi cuc/,"VDNC"],[/tai xanh|prrs/,"TAIXANH"],[/dich ta (lon|heo) co dien/,"DTLCD"],[/tu huyet trung/,"THT"],[/benh dai|dai tren (cho|meo)/,"DAI"]];
  let strain="Chưa xác định";for(const [re,k] of D){if(re.test(sx)){strain=k;break;}}
  const A="(?:con\\s*)?(?:lợn|heo|bò|trâu|trâu, bò|trâu bò|gia súc|dê|cừu)";
  let kg=g(/([\d][\d.,]*)\s*kg/);const tn=tx.match(/([\d][\d.,]*)\s*tấn/);if(kg==null&&tn){const v=+tn[1].replace(",",".");if(isFinite(v))kg=Math.round(v*1000);}
  return {strain,kg,
   cull:g(new RegExp("tiêu hủy[^\\d]{0,30}?([\\d][\\d.,]*)\\s*"+A))??g(new RegExp("([\\d][\\d.,]*)\\s*"+A+"[^.\\d]{0,25}(?:bị\\s*|buộc\\s*|phải\\s*)*tiêu hủy")),
   dead:g(new RegExp("([\\d][\\d.,]*)\\s*"+A+"?[^.\\d]{0,20}chết")),
   sick:g(new RegExp("([\\d][\\d.,]*)\\s*"+A+"[^.\\d]{0,25}(?:mắc|nhiễm|dương tính|bị bệnh|ốm|có biểu hiện)"))};}
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "";}};
function itemDomain(it,link){const s=it.querySelector("source");const su=s?.getAttribute("url");if(su)return hostOf(su);
  const m=link.match(/[?&]url=([^&]+)/);if(m)return hostOf(decodeURIComponent(m[1]));const h=hostOf(link);return /news\.google|bing\.com/.test(h)?"":h;}
async function pool(items,n,fn){let i=0;const w=Array.from({length:n},async()=>{while(i<items.length){const k=i++;await fn(items[k],k);}});await Promise.all(w);}
let lastScan=null,scanInfo={};
function setScanStatus(){scanStatus.textContent=scanInfo.ok?t("scanDone",{t:lastScan.toLocaleTimeString(LOC()),ok:scanInfo.ok,n:scanInfo.n,k:news.length}):t("scanFail");}
async function scan(){
  const qs=buildQueries();btnScan.disabled=true;log(t("logStart",{n:qs.length}));
  const seen=new Set(),found=[],stat={};let ok=0,done=0;
  await pool(qs,5,async(q)=>{const x=await getXML(q.u);done++;progBar.style.width=(done/qs.length*100)+"%";scanStatus.textContent=`${t("scanning")} ${done}/${qs.length}`;
    stat[q.g]=stat[q.g]||{ok:0,n:0,k:0};stat[q.g].n++;
    if(!x){log("✗ ["+q.g+"] "+decodeURIComponent(q.u).slice(0,90));return;}ok++;stat[q.g].ok++;
    x.querySelectorAll("item").forEach(it=>{
      const rawT=(it.querySelector("title")?.textContent||"").trim();const title=rawT.replace(/\s+-\s+[^-]+$/,"");
      const desc=(it.querySelector("description")?.textContent||"").replace(/<[^>]+>/g," ");
      const link=it.querySelector("link")?.textContent||"";const pd=new Date(it.querySelector("pubDate")?.textContent||"");
      const full=title+" "+desc,s=strip(full);if(!KW.test(s)||!OUTBREAK.test(s)||isNaN(pd))return;
      const dom=itemDomain(it,link);const pt=findProv(title);const prov=pt||findProv(desc)||provFromDomain(dom);if(!prov)return;
      if(FOREIGN.test(" "+strip(title)+" ")&&!pt)return;
      const date=pd.toISOString().slice(0,10);if(daysSince(date)>45)return;
      const key=strip(title).replace(/[^a-z0-9]/g,"").slice(0,50);if(seen.has(key))return;seen.add(key);stat[q.g].k++;
      found.push({title,link,prov,date,dom,type:srcType(dom),ds:daysSince(date),over:/qua 21 ngay|het dich/.test(s),...extract(full)});});});
  news=found.sort((a,b)=>b.date.localeCompare(a.date));lastScan=new Date();scanInfo={ok,n:qs.length};setScanStatus();
  srcStat.innerHTML=Object.entries(stat).map(([g,v])=>`<span class="badge b-grey">${g}: ${v.ok}/${v.n} · ${v.k}</span>`).join("");
  log(t("logDone",{ok,n:qs.length,k:news.length}));if(!ok)log(t("logHint"));btnScan.disabled=false;render();}
btnScan.onclick=scan;
let timer=null;const setAuto=()=>{clearInterval(timer);if(autoScan.checked)timer=setInterval(scan,30*60*1000);};autoScan.onchange=setAuto;

applyStatic();drawSrc();drawStrainF();drawIslands();scanStatus.textContent=t("notScanned");render();setAuto();scan();
</script>
