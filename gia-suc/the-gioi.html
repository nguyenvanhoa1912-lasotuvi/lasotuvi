<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dịch bệnh gia súc Thế giới</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root,[data-theme="dark"]{
  --bg:#070c19;--panel:#0f172b;--panel2:#16213b;--ink:#eaf0ff;--muted:#8d9cbd;--line:#243152;
  --sea1:#0a1a36;--sea2:#030814;--land:#2b3d6b;--landline:#6a86c9;
  --red:#ff2e4d;--red-bg:rgba(255,46,77,.16);--amber:#ffb020;--amber-bg:rgba(255,176,32,.16);
  --nb:#a36bff;--hist:#29c5f6;--ok:#27d196;--accent:#4f8cff;--accent2:#7c4dff;
  --shadow:0 8px 28px rgba(0,0,0,.45);--isl:#bcd6ff;
}
[data-theme="light"]{
  --bg:#eef2f9;--panel:#ffffff;--panel2:#f4f7fc;--ink:#101a33;--muted:#5a6a8a;--line:#d7deeb;
  --sea1:#cfe4f7;--sea2:#b7d3ee;--land:#f7f9fc;--landline:#8193b7;
  --red-bg:#ffe3e8;--amber-bg:#fff2d6;--shadow:0 6px 20px rgba(20,40,80,.12);--isl:#0d3b7a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 "Be Vietnam Pro","Segoe UI",Roboto,Arial,sans-serif}
header{padding:14px 18px;background:linear-gradient(110deg,#1a0b2e 0%,#3a0d2a 35%,#7a0f25 70%,#b3121f 100%);color:#fff;
  display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between;box-shadow:var(--shadow)}
h1{font-size:20px;margin:0;font-weight:800;letter-spacing:.5px;display:flex;align-items:center;gap:10px}
h1 .dot{width:12px;height:12px;border-radius:50%;background:#ff4d63;box-shadow:0 0 0 0 rgba(255,77,99,.8);animation:pulse 1.6s infinite}
header .sub{color:#ffd6dc;font-size:12px}
header input[type=date]{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:5px 8px;color-scheme:dark}
.wrap{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:14px;padding:14px 18px;align-items:start}
@media(max-width:980px){.wrap{grid-template-columns:1fr}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
.card h2{font-size:14px;font-weight:700;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--panel2)}
.card h2::before{content:"";width:4px;height:16px;border-radius:2px;background:linear-gradient(var(--red),var(--accent2));margin-right:8px}
.card h2 .t{display:flex;align-items:center;flex:1}
.card .body{padding:12px 14px}
.maptools{display:flex;flex-wrap:wrap;gap:6px;padding:9px 12px;border-bottom:1px solid var(--line);background:var(--panel2);align-items:center}
#mapBox{position:relative}
#map{height:80vh;min-height:560px;background:radial-gradient(ellipse at 60% 40%,var(--sea1),var(--sea2))}
.leaflet-container{font:inherit;background:transparent}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{border-radius:12px;padding:10px 12px;background:var(--panel2);border:1px solid var(--line);position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--c,var(--accent))}
.kpi b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--c,var(--ink))}
.kpi span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
button,select,input{font:inherit;color:inherit}
button{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:0;border-radius:8px;padding:6px 12px;cursor:pointer;font-weight:600}
button.ghost,.tbtn{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.tbtn{border-radius:18px;padding:4px 10px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;user-select:none}
.tbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tbtn input{display:none}
header button{background:#fff;color:#8a0f22}
header .tbtn{border-color:rgba(255,255,255,.4);color:#fff}
button:disabled{opacity:.5;cursor:wait}
.search{position:relative}
.search input{background:var(--bg);border:1px solid var(--line);border-radius:18px;padding:4px 12px;width:170px;font-size:12.5px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel);font-size:11.5px;text-transform:uppercase;letter-spacing:.3px}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{max-height:320px;overflow:auto}
.badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;font-weight:700;white-space:nowrap}
.b-red{background:var(--red-bg);color:var(--red)}
.b-amber{background:var(--amber-bg);color:var(--amber)}
.b-grey{border:1px solid var(--line);color:var(--muted)}
.chip{display:inline-block;padding:1px 7px;border-radius:9px;font-size:10.5px;font-weight:800;color:#111;letter-spacing:.2px}
.legend,.info{background:rgba(15,23,43,.92);color:#eaf0ff;padding:10px 12px;border-radius:10px;border:1px solid #2d3b63;font-size:12px;line-height:1.75;box-shadow:var(--shadow);backdrop-filter:blur(4px)}
[data-theme="light"] .legend,[data-theme="light"] .info{background:rgba(255,255,255,.95);color:#101a33;border-color:#d7deeb}
.info{min-width:210px}
.info h4{margin:0 0 2px;font-size:14px}
.sw{display:inline-block;width:13px;height:13px;border-radius:3px;margin-right:7px;vertical-align:-2px}
.isl{color:var(--isl);font-weight:700;font-size:11px;white-space:nowrap;text-align:center;letter-spacing:.5px}
/* nhãn tỉnh có dịch */
.plabel{pointer-events:none}
.plabel .box{transform:translate(-50%,-100%);display:inline-flex;flex-direction:column;align-items:center;white-space:nowrap}
.plabel .nm{display:inline-flex;align-items:center;gap:5px;background:rgba(8,10,22,.9);color:#fff;font-weight:800;font-size:11.5px;padding:2px 4px 2px 8px;border-radius:7px;border:1.5px solid var(--bc,#ff2e4d);box-shadow:0 0 14px var(--bc,#ff2e4d)}
.plabel .st{display:flex;gap:3px}
.plabel .tail{width:2px;height:9px;background:var(--bc,#ff2e4d)}
.pulse{width:16px;height:16px;border-radius:50%;background:var(--red);border:2px solid #fff;animation:pulse 1.6s infinite}
.pulse.amber{background:var(--amber);animation-name:pulseA}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,46,77,.8)}70%{box-shadow:0 0 0 18px rgba(255,46,77,0)}100%{box-shadow:0 0 0 0 rgba(255,46,77,0)}}
@keyframes pulseA{0%{box-shadow:0 0 0 0 rgba(255,176,32,.8)}70%{box-shadow:0 0 0 16px rgba(255,176,32,0)}100%{box-shadow:0 0 0 0 rgba(255,176,32,0)}}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);border:1px solid var(--line)}
.leaflet-popup-content{margin:12px 14px;min-width:270px}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-color:var(--line)}
.pop h3{margin:0 0 6px;font-size:16px;font-weight:800}
.pop .ob{border-top:1px dashed var(--line);padding-top:7px;margin-top:7px}
.pop dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin:4px 0;font-size:12.5px}
.pop dt{color:var(--muted)}.pop dd{margin:0;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;margin:4px 0 2px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--amber))}
.log{font:12px/1.4 ui-monospace,Consolas,monospace;color:var(--muted);max-height:120px;overflow:auto;white-space:pre-wrap}
form.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
form.grid label{font-size:11.5px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
form.grid input,form.grid select{padding:6px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.note{font-size:11.5px;color:var(--muted)}
details summary{cursor:pointer;font-weight:600;padding:6px 0}
a{color:var(--accent)}
#mapBox:fullscreen #map{height:100vh}
@media print{header .row,.maptools,details{display:none}.wrap{grid-template-columns:1fr}}
header{background:linear-gradient(110deg,#03201a 0%,#0b3d2e 35%,#6b3d0a 72%,#b3121f 100%)}
.lang{display:inline-flex;border:1px solid rgba(255,255,255,.45);border-radius:18px;overflow:hidden}
.lang button{background:transparent;color:#fff;border-radius:0;padding:4px 11px;font-size:12px;font-weight:700}
.lang button.on{background:#fff;color:#8a0f22}
header a.nav.back{background:#fff;color:#8a0f22;font-weight:700}
header a.nav{color:#fff;text-decoration:none;border:1px solid rgba(255,255,255,.45);border-radius:18px;padding:4px 11px;font-size:12px;font-weight:600}
header select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:6px;padding:5px 6px}
header select option{color:#111}
.src-grid{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:12.5px}
@media(max-width:520px){.src-grid{grid-template-columns:1fr}}
.src-grid label{display:flex;gap:6px;align-items:flex-start}
.src-grid small{color:var(--muted);display:block}
textarea{width:100%;min-height:70px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:6px;font:12px/1.4 ui-monospace,Consolas,monospace}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--red));transition:width .3s}
.srcstat{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.host{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.regions .tbtn{padding:3px 8px}
.dtype{font-size:10.5px;color:var(--muted);font-weight:500}
.plabel .nm .ev{font-weight:600;color:#ffd0d6;font-size:10.5px}
@media(max-width:600px){.wrap{padding:8px;gap:10px}header{padding:10px 12px}h1{font-size:16px}.info.leaflet-control{display:none}.card h2{flex-wrap:wrap}.card h2 .t{flex:1 1 100%}.maptools{padding:8px}.kpi b{font-size:20px}}
</style>
</head>
<body>
<header>
  <div>
    <h1><span class="dot"></span><span data-i18n="title"></span></h1>
    <div class="sub" data-i18n="subtitle"></div>
  </div>
  <div class="row">
    <span class="sub" data-i18n="refDate"></span><input type="date" id="refDate">
    <span class="sub" data-i18n="window"></span>
    <select id="selWin"><option value="21" selected>21</option><option value="30">30</option><option value="60">60</option><option value="90">90</option></select>
    <button id="btnScan" data-i18n="scan"></button>
    <label class="tbtn on"><input type="checkbox" id="autoScan" checked><span data-i18n="auto"></span></label>
    <a class="nav back" href="https://avian-influenza-situation.blogspot.com/" target="_top" data-i18n="back"></a>
    <a class="nav" href="index.html" data-i18n="toVN"></a>
    <a class="nav" href="../cum-gia-cam/the-gioi.html" data-i18n="toAI"></a>
    <button class="ghost tbtn" id="btnTheme" style="color:#fff"></button>
    <div class="lang"><button data-lang="vi">VI</button><button data-lang="en">EN</button></div>
  </div>
</header>

<div class="wrap">
  <div class="card">
    <h2><span class="t" data-i18n="mapTitle"></span><span class="note" id="scanStatus"></span></h2>
    <div class="maptools">
      <div class="search"><input id="q" list="dl" data-i18n-ph="searchPh"><datalist id="dl"></datalist></div>
      <label class="tbtn on"><input type="checkbox" id="optLabel" checked><span data-i18n="optLabel"></span></label>
      <label class="tbtn on"><input type="checkbox" id="optPulse" checked><span data-i18n="optPulse"></span></label>
      <label class="tbtn on"><input type="checkbox" id="optHist" checked><span data-i18n="optHist"></span></label>
      <span class="note" data-i18n="strain"></span><span id="strainF" class="row" style="gap:4px"></span>
      <span class="note" data-i18n="hostL"></span><span id="hostF" class="row" style="gap:4px"></span>
      <span style="flex:1"></span>
      <span class="row regions" id="regions" style="gap:4px"></span>
      <button class="ghost tbtn" id="btnFull" data-i18n="full"></button>
      <button class="ghost tbtn" id="btnPrint" data-i18n="print"></button>
    </div>
    <div id="mapBox"><div id="map"></div></div>
  </div>

  <div style="display:flex;flex-direction:column;gap:14px;min-width:0">
    <div class="card">
      <h2><span class="t" id="ovTitle"></span></h2>
      <div class="body">
        <div class="kpis">
          <div class="kpi" style="--c:var(--red)"><b id="kC">0</b><span data-i18n="kC"></span></div>
          <div class="kpi" style="--c:var(--amber)"><b id="kE">0</b><span data-i18n="kE"></span></div>
          <div class="kpi" style="--c:var(--nb)"><b id="kB">0</b><span data-i18n="kB"></span></div>
          <div class="kpi" style="--c:var(--hist)"><b id="kH">0</b><span data-i18n="kH"></span></div>
        </div>
        <p class="note" id="kNote" style="margin:10px 0 0"></p>
      </div>
    </div>

    <div class="card">
      <h2><span class="t" data-i18n="activeTitle"></span></h2>
      <div class="body scroll"><table id="tActive"></table></div>
    </div>

    <div class="card">
      <h2><span class="t" data-i18n="newsTitle"></span></h2>
      <div class="body">
        <div class="scroll"><table id="tNews"></table></div>
        <div class="prog"><i id="progBar"></i></div>
        <details><summary data-i18n="logTitle"></summary><div class="srcstat" id="srcStat"></div><div class="log" id="log"></div></details>
      </div>
    </div>

    <div class="card">
      <h2><span class="t" data-i18n="srcTitle"></span><span class="note" id="srcCount"></span></h2>
      <div class="body">
        <div class="src-grid" id="srcGrid"></div>
        <details style="margin-top:6px"><summary data-i18n="customTitle"></summary>
          <p class="note" data-i18n="customHelp"></p>
          <textarea id="customSrc" spellcheck="false"></textarea>
          <div class="row" style="margin-top:6px"><button id="btnSaveSrc" data-i18n="saveSrc"></button><span class="note" id="srcSaved"></span></div>
        </details>
      </div>
    </div>

    <div class="card">
      <h2><span class="t" data-i18n="verTitle"></span><span class="row" style="gap:6px"><button class="ghost tbtn" id="btnExport" data-i18n="export"></button><label class="tbtn"><input type="file" id="fileImport" accept=".json"><span data-i18n="import"></span></label></span></h2>
      <div class="body">
        <div class="scroll"><table id="tAll"></table></div>
        <details><summary data-i18n="addTitle"></summary>
          <form class="grid" id="frm">
            <label><span data-i18n="fCountry"></span><select name="a3" id="selC" required></select></label>
            <label><span data-i18n="fArea"></span><input name="area"></label>
            <label><span data-i18n="fDate"></span><input type="date" name="date" required></label>
            <label><span data-i18n="fStrain"></span><select name="strain" id="selStrain"></select></label>
            <label><span data-i18n="fHost"></span><select name="host" id="selHost"></select></label>
            <label><span data-i18n="fEvents"></span><input type="number" min="0" name="events"></label>
            <label><span data-i18n="fSick"></span><input type="number" min="0" name="sick"></label>
            <label><span data-i18n="fDead"></span><input type="number" min="0" name="dead"></label>
            <label><span data-i18n="fCull"></span><input type="number" min="0" name="cull"></label>
            <label><span data-i18n="fUrl"></span><input name="url" type="url"></label>
            <label style="grid-column:1/-1"><span data-i18n="fNote"></span><input name="note"></label>
            <div class="row" style="grid-column:1/-1"><button type="submit" data-i18n="save"></button><span class="note" data-i18n="saveNote"></span></div>
          </form>
        </details>
      </div>
    </div>

    <div class="card">
      <h2><span class="t" data-i18n="ctxTitle"></span></h2>
      <div class="body" style="font-size:12.5px" id="ctxBody"></div>
    </div>
  </div>
</div>

function findCountry(text){
  if(!text)return null;let best=null,bi=1e9,bl=0;
  const lo=" "+text.toLowerCase().replace(/[^\p{L}\p{N}. ]/gu," ")+" ";
  for(const k of EN_KEYS){const i=lo.indexOf(" "+k+" ");if(i>=0&&(i<bi||(i===bi&&k.length>bl))){bi=i;bl=k.length;best=EN_ALIAS[k];}}

}

function styleF(f){const s=ST[f.properties.a3]||{level:"none"};

  if(s.level==="red"){const o=Math.min(.95,.55+Math.log10(1+s.ev)*.18);return {...base,fillColor:COL.red,fillOpacity:o,color:"#ffd0d6",weight:1.1};}
  if(s.level==="amber")return {...base,fillColor:COL.amber,fillOpacity:.85,color:"#ffe7b3",weight:1};
  if(s.level==="hist"&&opt("optHist"))return {...base,fillColor:COL.hist,fillOpacity:.28,color:COL.hist,weight:1,dashArray:"2 3"};
  return base;}
function obHTML(r,auto){const left=WINDOW-r.ds,pct=Math.min(100,Math.max(0,r.ds/WINDOW*100));
  return `<div class="ob">${auto?`<b style="color:var(--amber)">${t("autoNews")}</b>`:""}
  <div class="row" style="gap:6px;margin-bottom:3px">${chip(r.strain)}<b style="font-size:12px">${esc(strainFull(r.strain))}</b> ${auto?"":hostTag(r.host)}<span class="note">${esc(r.area||r.dom||"")}</span></div>
  <dl><dt>${t("dt_"+(auto?"pub":r.dt||"detect"))}</dt><dd>${fmtD(r.date)} · ${t("ago",{d:r.ds})}</dd>
  ${auto?"":`<dt>${t("events")}</dt><dd>${fmtN(r.events)}</dd>`}<dt>${t("sick")}</dt><dd>${fmtN(r.sick)}</dd><dt>${t("dead")}</dt><dd>${fmtN(r.dead)}</dd><dt>${t("cull")}</dt><dd>${fmtN(r.cull)}</dd></dl>
  <div class="bar"><i style="width:${pct}%"></i></div><div class="note">${left>=0?t("left",{d:left}):t("passed")}</div>
  ${!auto&&noteOf(r)?`<div class="note" style="margin-top:3px">${esc(noteOf(r))}</div>`:""}
  ${(r.url||r.link)?`<a href="${esc(r.url||r.link)}" target="_blank">${auto?esc(r.title):t("src")+": "+esc(r.src||"link")}</a>`:""}</div>`;}
function popupHTML(a3){const s=ST[a3];
  const st=s.level==="red"?`<span class="badge b-red">${t("stRed",{w:WINDOW})}</span>`:s.level==="amber"?`<span class="badge b-amber">${t("stAmber")}</span>`
   :s.level==="hist"?`<span class="badge" style="background:rgba(41,197,246,.16);color:${COL.hist}">${t("stHist")}</span>`:`<span class="badge b-grey">${t("stNone",{w:WINDOW})}</span>`;
  let h=`<div class="pop"><h3>${esc(cname(a3))}</h3>${st}`;
  s.active.forEach(r=>h+=obHTML(r));s.ns.slice(0,4).forEach(n=>h+=obHTML(n,true));
  if(!s.active.length&&s.last)h+=`<div class="note" style="margin-top:6px">${t("lastRef")}</div>`+obHTML(s.last);
  if(a3==="VNM")h+=`<div style="margin-top:8px"><a href="index.html">${t("toVN")} →</a></div>`;
  return h+"</div>";}

/* ================= QUÉT TIN TỰ ĐỘNG ================= */
const PROXIES=[u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://corsproxy.io/?url="+encodeURIComponent(u),u=>"https://api.codetabs.com/v1/proxy?quest="+encodeURIComponent(u)];
const logEl=document.getElementById("log");const log=m=>{logEl.textContent=`[${new Date().toLocaleTimeString(LOC())}] ${m}\n`+logEl.textContent;};
async function getXML(url){for(const px of PROXIES){try{const ctl=new AbortController();const tm=setTimeout(()=>ctl.abort(),12000);
  const r=await fetch(px(url),{signal:ctl.signal});clearTimeout(tm);if(!r.ok)continue;const x=new DOMParser().parseFromString(await r.text(),"text/xml");if(x.querySelector("item"))return x;}catch(e){}}return null;}
const KW=/african swine fever|\basf\b|foot.and.mouth|\bfmd\b|lumpy skin|peste des petits|\bppr\b|bluetongue|classical swine fever|sheep.?pox|goat.?pox|dich ta lon|ta heo|lo mom long mong|viem da noi cuc|luoi xanh/;
const OUTBREAK=/outbreak|confirm|detect|cull|infected|positive|case|herd|farm|spread|o dich|phat hien|tieu huy|bung phat|xac nhan|duong tinh|lay lan/;
const EXCL=/recipe|stock market|share price/;
const toNum=s=>{if(!s)return null;const n=+String(s).replace(/,(?=\d{3}\b)/g,"").replace(/\.(?=\d{3}\b)/g,"");return isFinite(n)?n:null;};
function extract(raw){const tx=raw.toLowerCase().normalize("NFC");const sx=strip(raw);
  const D=[[/african swine fever|\basf\b|dich ta (lon|heo) chau phi|ta (lon|heo) chau phi/,"ASF","pig"],[/foot.and.mouth|\bfmd\b|lo mom long mong/,"FMD","cattle"],[/lumpy skin|viem da noi cuc/,"LSD","cattle"],
   [/peste des petits|\bppr\b/,"PPR","smallrum"],[/bluetongue|luoi xanh/,"BT","smallrum"],[/classical swine fever|ta lon co dien/,"CSF","pig"],[/sheep.?pox|goat.?pox|dau de|dau cuu/,"SGP","smallrum"]];
  let strain="Chưa xác định",host="mixed";for(const [re,k,h] of D){if(re.test(sx)){strain=k;host=h;break;}}
  if(/wild boar|lon rung/.test(sx))host="wild";
  let cull=null;const m=tx.match(/([\d][\d.,]*)\s*(million|triệu)?\s*(?:pigs|hogs|swine|cattle|cows|head|animals|sheep|goats|buffalo|con lợn|con heo|con bò|con trâu|con gia súc|con)/);
  if(m){cull=toNum(m[1]);if(cull!=null&&m[2])cull=Math.round(cull*1e6);}
  const d=tx.match(/([\d][\d.,]*)\s*(?:pigs|cattle|cows|animals|con)?\s*(?:died|dead|chết)/);
  return {strain,host,cull,dead:d?toNum(d[1]):null};}
const hostOf=u=>{try{return new URL(u).hostname.replace(/^www\./,"");}catch(e){return "";}};
function itemDomain(it,link){const s=it.querySelector("source");const su=s?.getAttribute("url");if(su)return hostOf(su);const m=link.match(/[?&]url=([^&]+)/);if(m)return hostOf(decodeURIComponent(m[1]));const h=hostOf(link);return /news\.google|bing\.com/.test(h)?"":h;}
async function pool(items,n,fn){let i=0;await Promise.all(Array.from({length:n},async()=>{while(i<items.length){const k=i++;await fn(items[k]);}}));}
let lastScan=null,scanInfo={};
function setScanStatus(){scanStatus.textContent=scanInfo.ok?t("scanDone",{t:lastScan.toLocaleTimeString(LOC()),ok:scanInfo.ok,n:scanInfo.n,k:news.length}):t("scanFail");}
async function scan(){const qs=buildQueries();btnScan.disabled=true;log(t("logStart",{n:qs.length}));
  const seen=new Set(),found=[],stat={};let ok=0,done=0;
  await pool(qs,5,async q=>{const x=await getXML(q.u);done++;progBar.style.width=(done/qs.length*100)+"%";scanStatus.textContent=`${t("scanning")} ${done}/${qs.length}`;
    stat[q.g]=stat[q.g]||{ok:0,n:0,k:0};stat[q.g].n++;if(!x){log("✗ ["+q.g+"] "+decodeURIComponent(q.u).slice(0,90));return;}ok++;stat[q.g].ok++;
    x.querySelectorAll("item").forEach(it=>{const title=(it.querySelector("title")?.textContent||"").trim().replace(/\s+-\s+[^-]+$/,"");
      const desc=(it.querySelector("description")?.textContent||"").replace(/<[^>]+>/g," ").slice(0,600);const link=it.querySelector("link")?.textContent||"";
      const pd=new Date(it.querySelector("pubDate")?.textContent||"");const full=title+" "+desc,s=strip(full);
      if(!KW.test(s)||!OUTBREAK.test(s)||EXCL.test(s)||isNaN(pd))return;const date=pd.toISOString().slice(0,10);if(daysSince(date)>45||daysSince(date)<0)return;
      const a3=findCountry(title)||findCountry(desc);if(!a3||!CP[a3])return;
      const key=strip(title).replace(/[^a-z0-9]/g,"").slice(0,50);if(seen.has(key))return;seen.add(key);stat[q.g].k++;
      found.push({title,link,a3,date,dom:itemDomain(it,link),g:q.g,ds:daysSince(date),...extract(full)});});});
  news=found.sort((a,b)=>b.date.localeCompare(a.date));lastScan=new Date();scanInfo={ok,n:qs.length};setScanStatus();
  srcStat.innerHTML=Object.entries(stat).map(([g,v])=>`<span class="badge b-grey">${g}: ${v.ok}/${v.n} · ${v.k}</span>`).join("");
  log(t("logDone",{ok,n:qs.length,k:news.length}));if(!ok)log(t("logHint"));btnScan.disabled=false;render();}
btnScan.onclick=scan;let timer=null;const setAuto=()=>{clearInterval(timer);if(autoScan.checked)timer=setInterval(scan,30*60*1000);};autoScan.onchange=setAuto;

applyStatic();drawTools();drawSrc();drawIslands();map.removeLayer(islLayer);scanStatus.textContent=t("notScanned");render();map.fitBounds(REG.world);setAuto();scan();
</script>
